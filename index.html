<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1E38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日本語">
<title>日本語トレーナー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1E38'/%3E%3Crect x='10' y='16' width='44' height='6' rx='3' fill='%23E4573D'/%3E%3Ctext x='32' y='48' font-size='30' font-family='sans-serif' font-weight='700' fill='%23F4F1E8' text-anchor='middle'%3E日%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#0E1E38; --ink2:#162C4F; --line:#2A4373; --paper:#F4F1E8; --dim:#8A9CBE;
  --red:#E4573D; --grn:#2FA05E; --yel:#F0C560;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  -webkit-text-size-adjust:100%;margin:0;padding:0;background:var(--ink);}
body{
  color:var(--paper);
  font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  padding:16px 13px calc(34px + env(safe-area-inset-bottom));
  min-height:100vh;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.wrap{max-width:620px;margin:0 auto;}
button{font-family:inherit;}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px;}

.head{display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:2px solid var(--line);padding-bottom:11px;margin-bottom:14px;}
.h1{font-size:30px;font-weight:900;letter-spacing:-.5px;line-height:1.1;}
.h1 small{display:block;font-size:14px;letter-spacing:.26em;color:var(--dim);margin-top:5px;font-weight:500;}
.cnt{text-align:right;font-size:14.5px;color:var(--dim);letter-spacing:.06em;line-height:1.55;}
.cnt b{display:block;font-size:28px;color:var(--paper);font-weight:700;}

.nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
.nav button{min-width:72px;padding:12px 4px;}
.nav button{flex:1;padding:10px 2px;border:1.5px solid var(--line);background:transparent;color:var(--dim);
  border-radius:4px;font-size:18px;font-weight:700;cursor:pointer;}
.nav button[data-on="1"]{background:var(--paper);color:var(--ink);border-color:var(--paper);}
.sub{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;}
.sub button{flex:1;min-width:86px;padding:10px 6px;border:1px solid var(--line);background:transparent;
  color:var(--dim);border-radius:4px;font-size:16.5px;font-weight:600;cursor:pointer;}
.sub button[data-on="1"]{border-color:var(--red);color:#F0A091;}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.chip{padding:10px 14px;border-radius:99px;border:1.5px solid var(--line);background:transparent;
  color:var(--dim);font-size:20.5px;font-weight:700;cursor:pointer;}
.chip[data-on="1"]{background:var(--paper);color:var(--ink);border-color:var(--paper);}
.chip.sm{font-size:16px;padding:6px 11px;font-weight:500;}
.chip.sm[data-on="1"]{background:var(--red);color:#fff;border-color:var(--red);}
.lab{font-size:14.5px;letter-spacing:.22em;color:#5E739C;margin:12px 0 6px;}

.card{background:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:22px 18px;}
.plate{background:var(--paper);color:var(--ink);border-radius:6px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.34);}
.stripe{height:9px;}
.plate .in{padding:30px 18px 24px;text-align:center;}
.catline{display:flex;align-items:center;gap:7px;justify-content:center;font-size:14.5px;
  letter-spacing:.2em;color:#7B8AA5;margin-bottom:6px;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.kana{font-size:24px;color:#5D6B85;letter-spacing:.14em;min-height:18px;}
.jpbig{font-size:44px;font-weight:900;line-height:1.42;margin:7px 0 9px;word-break:keep-all;}
.ro{font-size:15.5px;letter-spacing:.22em;color:#8390A8;}
.div{height:1px;background:#E7E2D4;margin:20px 0 16px;}
.ko{font-size:30px;font-weight:700;color:#162C4F;}
.veil{color:#B4AEA0;font-size:22px;}

.row{display:flex;gap:7px;margin-top:11px;}
.btn{flex:1;padding:15px 6px;border-radius:5px;border:1.5px solid var(--line);background:transparent;
  color:var(--paper);font-size:21.5px;font-weight:700;cursor:pointer;}
.btn.main{background:var(--paper);color:var(--ink);border-color:var(--paper);}
.btn.go{background:var(--red);border-color:var(--red);color:#fff;}
.btn.stop{background:#8E2E1F;border-color:#8E2E1F;color:#fff;}
.btn.sm{padding:9px 5px;font-size:20px;font-weight:500;color:var(--dim);}
.btn.again{border-color:#7A3A32;color:#F0A091;}
.btn.good{border-color:#2A5C7A;color:#9CC8E4;}
.btn.easy{border-color:#2C6B4C;color:#96D6B3;}
.btn[disabled]{opacity:.4;}
.pill{display:flex;gap:7px;justify-content:center;margin-top:14px;}
.pill button{background:transparent;border:1.5px solid var(--line);color:var(--dim);
  padding:8px 15px;border-radius:99px;font-size:20px;cursor:pointer;}

.tag{font-size:14.5px;letter-spacing:.2em;color:var(--red);margin-bottom:12px;}
.stage{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;}
.koq{font-size:32px;font-weight:800;line-height:1.5;}
.jpline{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);}
.jpline .k{font-size:25px;color:var(--dim);letter-spacing:.08em;}
.jpline .j{font-size:42px;font-weight:900;margin-top:5px;line-height:1.4;}
.hint{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);font-size:20.5px;color:#6C80A6;}
.bar{height:3px;background:rgba(255,255,255,.09);border-radius:2px;overflow:hidden;margin:14px 0 6px;}
.bar i{display:block;height:100%;background:var(--red);}
.status{font-size:15.5px;letter-spacing:.18em;color:var(--dim);text-align:center;}
.set{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:15.5px;color:var(--dim);align-items:center;}
.set select{background:var(--ink2);color:var(--paper);border:1px solid var(--line);border-radius:4px;
  padding:5px 7px;font-family:inherit;font-size:20px;margin-left:4px;}

.opts{display:flex;gap:7px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
.opt2{padding:11px 20px;font-size:25px;font-weight:800;border-radius:5px;cursor:pointer;
  border:1.5px solid var(--line);background:transparent;color:var(--paper);}
.opt{display:block;width:100%;text-align:left;padding:16px 16px;border-radius:5px;font-size:25.5px;
  margin-bottom:7px;border:1.5px solid var(--line);background:transparent;color:var(--paper);cursor:pointer;}
.opt.right,.opt2.right{border-color:var(--grn);background:rgba(47,160,94,.15);}
.opt.wrong,.opt2.wrong{border-color:var(--red);background:rgba(228,87,61,.13);}
.why{font-size:20.5px;line-height:1.7;color:#C6D0E2;background:rgba(255,255,255,.05);
  border-radius:5px;padding:11px 13px;margin-top:12px;text-align:left;}

.glist button{display:flex;width:100%;text-align:left;background:var(--ink2);border:1px solid var(--line);
  border-radius:5px;padding:14px 15px;margin-bottom:8px;cursor:pointer;color:var(--paper);
  justify-content:space-between;align-items:center;gap:10px;}
.glist h4{margin:0;font-size:24px;font-weight:800;}
.glist p{margin:4px 0 0;font-size:20px;color:var(--dim);}
.badge{font-size:14.5px;letter-spacing:.1em;padding:4px 9px;border-radius:99px;border:1px solid var(--grn);
  color:#9CDCB8;white-space:nowrap;}
.ex{margin-top:15px;border-left:3px solid var(--red);padding:2px 0 2px 13px;}
.ex>div{margin-bottom:13px;}
.ex .j{font-size:31px;font-weight:700;}
.ex .r{font-size:15px;letter-spacing:.16em;color:#7C8DAE;margin-top:3px;}
.ex .m{font-size:20.5px;color:#C4CEE0;margin-top:3px;}
.body{font-size:24px;line-height:1.85;color:#D8DFEC;}

.word{background:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:14px 15px;
  margin-bottom:6px;display:flex;align-items:center;gap:11px;cursor:pointer;}
.word .n{font-size:14.5px;color:#5E739C;width:16px;flex:none;}
.word .m2{flex:1;min-width:0;}
.word .k2{font-size:24.5px;color:var(--dim);}
.word .j2{font-size:38px;font-weight:800;line-height:1.35;}
.word .mean{font-size:28px;color:#C6D0E2;margin-top:2px;}
.word .hid{font-size:22px;color:#546B94;margin-top:2px;}
.spk{background:none;border:1px solid var(--line);color:var(--dim);border-radius:99px;
  width:42px;height:42px;flex:none;cursor:pointer;font-size:16px;}

.slot{min-height:56px;border:1.5px dashed var(--line);border-radius:6px;margin-top:16px;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:9px;}
.tile{padding:11px 14px;border-radius:5px;border:1.5px solid var(--line);background:transparent;
  color:var(--paper);font-size:29px;font-weight:700;cursor:pointer;line-height:1.25;text-align:center;}
.tile .tk{display:block;font-size:16.5px;font-weight:500;color:#8A9CBE;margin-bottom:1px;}
.tile.set2{background:rgba(255,255,255,.09);}
.pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
.ph{font-size:16.5px;color:#546B94;}
.res{margin-top:14px;padding-top:13px;border-top:1px dashed var(--line);text-align:center;}

.chap{display:flex;width:100%;text-align:left;background:var(--ink2);border:1px solid var(--line);
  border-radius:6px;padding:12px 14px;margin-bottom:6px;cursor:pointer;color:var(--paper);
  align-items:center;gap:10px;}
.chap .no2{font-size:14.5px;letter-spacing:.14em;color:#5E739C;width:42px;flex:none;}
.chap .tt{flex:1;font-size:22.5px;font-weight:700;}
.st{font-size:14.5px;letter-spacing:.08em;padding:4px 8px;border-radius:99px;white-space:nowrap;}
.st.d{border:1px solid var(--grn);color:#9CDCB8;}
.st.c{border:1px solid var(--red);color:#F0A091;}
.st.l{border:1px solid var(--line);color:#5E739C;}
.wlist{background:rgba(255,255,255,.04);border-radius:6px;padding:11px 13px;margin:-2px 0 9px;}
.wl{display:flex;justify-content:space-between;font-size:25px;padding:7px 0;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.06);}
.wl:last-child{border:none;}
.wl b{font-weight:700;} .wl s{text-decoration:none;color:var(--dim);text-align:right;}

.empty{text-align:center;padding:36px 14px;color:var(--dim);font-size:21.5px;line-height:1.8;}
.empty b{display:block;color:var(--paper);font-size:28px;margin-bottom:8px;}
.note{font-size:16.5px;color:var(--dim);line-height:1.75;margin-top:12px;}
.rule table{width:100%;border-collapse:collapse;font-size:21px;}
.rule td{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);}
.rule td:first-child{color:var(--dim);width:78px;font-size:15.5px;letter-spacing:.1em;}
.rule td:last-child{font-weight:700;}
.link{background:none;border:none;color:var(--dim);font-size:16.5px;cursor:pointer;padding:0;
  text-decoration:underline;text-underline-offset:3px;}
.score{font-size:50px;font-weight:900;line-height:1;}
.steps{display:flex;gap:4px;margin:0 0 14px;}
.steps span{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12);}
.steps span[data-on="1"]{background:var(--red);}
.steps span[data-done="1"]{background:var(--grn);}
.stepname{font-size:15px;letter-spacing:.2em;color:#5E739C;margin-bottom:10px;}
.goal{font-size:29px;font-weight:800;line-height:1.55;}
.sent{background:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:14px 15px;margin-bottom:8px;}
.sent .sk{font-size:24px;color:var(--dim);}
.sent .sj{font-size:35px;font-weight:800;line-height:1.4;margin:3px 0 5px;}
.sent .sm{font-size:24.5px;color:#C6D0E2;}
.sent .sb{margin-top:9px;display:flex;gap:6px;}
.sent .sb button{background:transparent;border:1px solid var(--line);color:var(--dim);
  padding:6px 13px;border-radius:99px;font-size:20px;cursor:pointer;}



.qform{font-size:35px;font-weight:900;color:#F0A091;text-align:center;line-height:1.35;
  margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line);}
body.fs2 .qform{font-size:39px;} body.fs3 .qform{font-size:43px;}

/* 맞추기 카드 */
.gcard{min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 6px;}
.gcard .gsub{font-size:20.5px;color:#8A9CBE;font-weight:500;line-height:1.2;word-break:break-all;}
.gcard .gmain{font-size:31px;font-weight:800;line-height:1.25;word-break:break-all;}
body.fs2 .gcard .gmain{font-size:34px;} body.fs3 .gcard .gmain{font-size:37px;}
body.fs2 .gcard .gsub{font-size:22px;} body.fs3 .gcard .gsub{font-size:23.5px;}

/* 단어장 카드 */
.gsec{display:flex;align-items:center;gap:9px;margin:22px 0 10px;font-size:23px;font-weight:800;
  padding-bottom:7px;border-bottom:2px solid var(--line);}
.gsec .gnum{width:28px;height:28px;flex:none;border-radius:50%;background:#2B5E8F;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;}
.hstep{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line);}
.hstep:last-child{border-bottom:none;}
.hstep .hn{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid #2FA05E;color:#9BE8BE;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;margin-top:2px;}
.hstep .hb{flex:1;min-width:0;}
.hstep .hb b{display:block;font-size:24px;font-weight:800;line-height:1.35;}
.hstep .hd{font-size:21px;color:#C6D0E2;margin-top:3px;line-height:1.55;}
.hstep .hx{font-size:25px;font-weight:700;color:#9CC8E4;margin-top:6px;line-height:1.5;}
.sent .skp{font-size:21px;color:#C99BE0;margin-top:3px;letter-spacing:.02em;}
.gitem{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:14px 14px;margin-bottom:9px;color:inherit;}
.gitem .gi-n{width:30px;height:30px;flex:none;border-radius:50%;background:var(--bg);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:#8A9CBE;font-weight:800;}
.gitem .gi-b{flex:1;min-width:0;}
.gitem .gi-b b{display:block;font-size:26px;font-weight:800;line-height:1.3;}
.gitem .gi-b i{display:block;font-style:normal;font-size:20px;color:#8A9CBE;margin-top:2px;}
.gitem .gi-b em{display:block;font-style:normal;font-size:22px;color:#9CC8E4;margin-top:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
body.fs2 .gitem .gi-b b{font-size:29px;} body.fs3 .gitem .gi-b b{font-size:32px;}
body.fs2 .hstep .hb b{font-size:27px;} body.fs3 .hstep .hb b{font-size:30px;}
body.fs2 .sent .skp{font-size:23px;} body.fs3 .sent .skp{font-size:25px;}
.rdline{padding:9px 0;border-bottom:1px solid var(--line);}
.rdline:last-child{border-bottom:none;}
.rdline .rk{font-size:20px;color:#5E739C;margin-bottom:2px;}
.rdline .rj{font-size:28px;font-weight:700;line-height:1.55;}
.rdline .rm{font-size:21px;color:#F0C560;margin-top:3px;}
body.fs2 .rdline .rj{font-size:31px;} body.fs3 .rdline .rj{font-size:34px;}
body.fs2 .rdline .rm{font-size:23px;} body.fs3 .rdline .rm{font-size:25px;}
.todo{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line);}
.todo:last-child{border-bottom:none;}
.todo .n{width:32px;height:32px;flex:none;border-radius:50%;background:var(--ink2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:#8A9CBE;}
.todo.ok .n{background:#1E4D35;border-color:#2FA05E;color:#9BE8BE;}
.todo.dim{opacity:.55;}
.todo .t{flex:1;min-width:0;}
.todo .t b{display:block;font-size:25px;font-weight:800;line-height:1.3;}
.todo .t i{display:block;font-style:normal;font-size:19.5px;color:#8A9CBE;margin-top:2px;}
.todo .btn.sm{max-width:92px;flex:none;}
.stat{font-size:40px;font-weight:900;line-height:1.1;}
body.fs2 .todo .t b{font-size:28px;} body.fs3 .todo .t b{font-size:31px;}
body.fs2 .todo .t i{font-size:21px;} body.fs3 .todo .t i{font-size:23px;}
.todo .t .mini,.pmini{display:block;font-size:18px;color:#8A9CBE;margin-top:6px;}
.pbar{display:block;height:5px;border-radius:3px;background:var(--line);margin:0 0 4px;overflow:hidden;}
.pbar em{display:block;height:100%;background:#2FA05E;}
body.fs2 .pmini{font-size:20px;} body.fs3 .pmini{font-size:22px;}
.todo .t .mb{display:block;height:5px;border-radius:3px;background:var(--line);margin:0 0 4px;overflow:hidden;}
.todo .t .mb em{display:block;height:100%;background:#2FA05E;}
body.fs2 .todo .t .mini{font-size:20px;} body.fs3 .todo .t .mini{font-size:22px;}
.kchips{display:flex;flex-wrap:wrap;gap:8px;}
.kchip{display:flex;flex-direction:column;align-items:center;min-width:72px;
  padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--ink2);}
.kchip b{font-size:34px;font-weight:900;line-height:1.1;}
.kchip i{font-style:normal;font-size:19px;color:#9CC8E4;margin-top:4px;}
.kchip u{text-decoration:none;font-size:16px;color:#8A9CBE;}
body.fs2 .kchip b{font-size:37px;} body.fs3 .kchip b{font-size:40px;}
.dots{display:flex;gap:4px;margin-top:4px;}
.dots i{width:14px;height:6px;border-radius:3px;background:var(--line);display:block;}
.dots i.on{background:#2FA05E;}
.opt .optk{display:block;font-size:20px;color:#8A9CBE;font-weight:500;margin-top:3px;}
body.fs2 .opt .optk{font-size:22px;} body.fs3 .opt .optk{font-size:24px;}
.calstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.calstrip .cal{height:40px;border-radius:7px;background:var(--ink2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:#5E739C;font-weight:700;}
.calstrip .cal.on{background:#1E4D35;border-color:#2FA05E;color:#9BE8BE;}
body.fs2 .calstrip .cal{height:44px;font-size:20px;} body.fs3 .calstrip .cal{height:48px;font-size:22px;}
.vrow{background:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:16px 16px;
  margin-bottom:9px;display:flex;align-items:center;gap:12px;}
.vmain{flex:1;min-width:0;}
.vread{font-size:25px;color:#8A9CBE;letter-spacing:.06em;margin-bottom:2px;}
.vjp{font-size:44px;font-weight:900;line-height:1.25;letter-spacing:-.5px;}
.vko{font-size:30px;font-weight:700;color:#F0C560;margin-top:5px;}
.vro{font-size:24px;color:#9CC8E4;margin-top:4px;letter-spacing:.08em;}
.radhint{font-size:20px;color:#9A8FA8;margin-top:6px;line-height:1.5;}
.radhint b{color:#E58A6A;font-size:23px;margin:0 2px;}
body.fs2 .radhint{font-size:22px;} body.fs3 .radhint{font-size:24px;}
.vspk{width:50px;height:50px;font-size:21px;}
body.fs2 .vjp{font-size:50px;} body.fs3 .vjp{font-size:56px;}
body.fs2 .vread{font-size:30px;} body.fs3 .vread{font-size:33px;}
body.fs2 .vko{font-size:33px;} body.fs3 .vko{font-size:36px;}
body.fs2 .vro{font-size:28px;} body.fs3 .vro{font-size:30px;}

/* 글씨 크기 단계 */
body.fs2 .word .j2{font-size:43px;} body.fs3 .word .j2{font-size:48px;}

  if(kana && kana!==jp) return kana;

var SAYFIX={"入れる":"いれる","入れば":"はいれば","入れます":"いれます"};
function splitJa(t){
  var parts=(t||"").split(/(?<=[。、,])/),out=[],cur="";
  if(!parts.length)return [t];
  for(var i=0;i<parts.length;i++){
    if((cur+parts[i]).length>90){if(cur)out.push(cur);cur=parts[i];}
    else cur+=parts[i];
  }
  if(cur)out.push(cur);
  return out.length?out:[t];
}
function say(text,rate){
  return new Promise(function(res){
    if(!window.speechSynthesis){setTimeout(res,600);return;}
    try{
      if(!voiceJa)loadVoices();
      var chunks=splitJa(text),i=0,done=false;
      function fin(){if(!done){done=true;res();}}
      function next(){
        if(i>=chunks.length){fin();return;}
        var u=new SpeechSynthesisUtterance(chunks[i++]);
        u.lang="ja-JP";u.rate=rate||0.85;u.volume=1;u.pitch=1;
        if(voiceJa)u.voice=voiceJa;
        u.onend=next;u.onerror=next;
        try{window.speechSynthesis.speak(u);}catch(e2){fin();return;}
        /* 안드로이드에서 재생이 멈춘 채 대기하는 문제 */
        setTimeout(function(){try{window.speechSynthesis.resume();}catch(e3){}},120);
      }
      window.speechSynthesis.cancel();
      /* cancel 직후 바로 speak하면 안드로이드에서 무시되는 경우가 있다 */
      setTimeout(next,60);
      setTimeout(fin,Math.max(3000,text.length*420));
    }catch(e){res();}
  });
}

function normalize(s){return (s||"").replace(/[\s、。，．,.!?！？「」『』ー]/g,"");}
function similarity(a,b){
  a=normalize(a);b=normalize(b);
  if(!a||!b)return 0;
  var m=a.length,n=b.length,i,j,d=[];
  for(i=0;i<=m;i++){d[i]=[i];}
  for(j=0;j<=n;j++){d[0][j]=j;}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
  return Math.max(0,Math.round((1-d[m][n]/Math.max(m,n))*100));
}

var RMAP={
"あ":"a","い":"i","う":"u","え":"e","お":"o",
"か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko","が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go",
"さ":"sa","し":"shi","す":"su","せ":"se","そ":"so","ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo",
"た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to","だ":"da","ぢ":"ji","づ":"zu","で":"de","ど":"do",
"な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no",
"は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho","ば":"ba","び":"bi","ぶ":"bu","べ":"be","ぼ":"bo",
"ぱ":"pa","ぴ":"pi","ぷ":"pu","ぺ":"pe","ぽ":"po",
"ま":"ma","み":"mi","む":"mu","め":"me","も":"mo","や":"ya","ゆ":"yu","よ":"yo",
"ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro","わ":"wa","を":"o",
"ぁ":"a","ぃ":"i","ぅ":"u","ぇ":"e","ぉ":"o","ゔ":"vu"};
var RSMALL={"ゃ":"ya","ゅ":"yu","ょ":"yo"};
function romaji(kana){
  var t=toHira(kana||""),out="",i=0,c,n,base,y,nx;
  while(i<t.length){
    c=t.charAt(i);n=t.charAt(i+1);
    if(c==="っ"){nx=RMAP[n]||(RSMALL[n]?"y":"");out+=nx?(nx.indexOf("ch")===0?"t":nx.charAt(0)):"";i++;continue;}
    if(c==="ん"){out+="n";nx=RMAP[n]||"";if(/^[aiueoy]/.test(nx))out+="'";i++;continue;}
    if(c==="ー"){var last=out.charAt(out.length-1);if(/[aiueo]/.test(last))out+=last;i++;continue;}
    if(RSMALL[n]&&RMAP[c]&&RMAP[c].charAt(RMAP[c].length-1)==="i"&&RMAP[c].length>1){
      base=RMAP[c].slice(0,-1);y=RSMALL[n];
      out+=(base==="sh"||base==="ch"||base==="j")?base+y.slice(1):base+y;
      i+=2;continue;}
    if(RMAP[c]){out+=RMAP[c];i++;continue;}
    out+=c;i++;
  }
  return out;
}

/* 히라가나 ↔ 가타카나 자동 변환 */
function toKata(t){
  return (t||"").replace(/[\u3041-\u3096]/g,function(c){return String.fromCharCode(c.charCodeAt(0)+0x60);});
}
function toHira(t){
  return (t||"").replace(/[\u30A1-\u30F6]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60);});
}

/* ん 받침 — 뒤 글자에 따라 ㄴ · ㅁ · ㅇ */
function koNasal(prevHan,next){
  var d=koDec(prevHan);
  if(!d||d.jong!==0)return null;
  var jong=4;                                                   /* ㄴ */
  if(next&&/[ぱぴぷぺぽばびぶべぼまみむめも]/.test(next))jong=16;  /* ㅁ */
  else if(next&&/[かきくけこがぎぐげご]/.test(next))jong=21;       /* ㅇ */
  else if(!next)jong=21;
  return koCom({cho:d.cho,jung:d.jung,jong:jong});
}
/* 촉음 받침 — 뒤 글자의 자음에 맞춥니다 */
function koGem(prevHan,next){
  var d=koDec(prevHan);
  if(!d||d.jong!==0)return null;
  var jong=19;                                     /* ㅅ 기본 */
  if(/[かきくけこ]/.test(next))jong=1;              /* ㄱ */
  else if(/[ぱぴぷぺぽ]/.test(next))jong=17;        /* ㅂ */
  return koCom({cho:d.cho,jung:d.jung,jong:jong});
}
/* は 가 조사가 아닌 자리 — 단어 안에 들어간 は */
var HA_FIXED=["あさごはん","ひるごはん","ばんごはん","ごはん","はんとし","はんぶん",
 "こうはい","しはつ","はん","はちじ","はつか","はっぴゃく","ははおや"];
/* 앱의 단어 데이터에서 は 로 시작하는 말을 전부 모읍니다 (활용형 포함) */
var HA_WORDS=null;
function haBuild(){
  var set={},i,j;
  HA_FIXED.forEach(function(w){set[w]=1;});
  var FV=["masu","masen","mashita","masendeshita","te","ta","nai","nakatta","tari","poten","caus","pass","vol","ba","tara","istem"];
  try{
    allWords().forEach(function(w){
      var k=toHira(String(w.kana||""));
      if(k.charAt(0)!=="は")return;
      set[k]=1;
      /* 동사·형용사는 활용형도 */
      for(j=0;j<FV.length;j++){
        try{var r=conjugate(w.jp,w.kana,FV[j]);var rk=toHira(String(r.kana||""));
          if(rk.charAt(0)==="は")set[rk]=1;}catch(e){}
      }
      if(/い$/.test(k)){
        var st=k.slice(0,-1);
        ["い","くない","かった","くなかった","くて","く","ければ","かったら","そう"].forEach(function(sf){set[st+sf]=1;});
      }
    });
  }catch(e){}
  /* 한 글자짜리(歯=は 등)는 조사와 구별할 수 없어 제외합니다 */
  HA_WORDS=Object.keys(set).filter(function(w){return w.length>=2;}).sort(function(a,b){return b.length-a.length;});
}
function haIsParticle(t,i){
  if(i<=0)return false;
  if(!HA_WORDS)haBuild();
  for(var z=0;z<HA_WORDS.length;z++){
    var w=HA_WORDS[z],hp=w.indexOf("は");
    if(hp<0)continue;
    var st=i-hp;
    if(st>=0&&t.substr(st,w.length)===w)return false;
  }
  return true;
}
/* おお · とお 처럼 お가 장음이 되는 단어 (と+おもいます 와 구별) */
var LONG_O=["おおきい","おおきな","おおい","おおく","とおい","とおく","とおか","とおる","こおり","おおさか"];
function isLongO(t,i){
  for(var z=0;z<LONG_O.length;z++){
    var w=LONG_O[z],op=w.indexOf("おお")+1;
    var st=i-op;
    if(st>=0&&t.substr(st,w.length)===w)return true;
  }
  return false;
}
function koPron(kana,sentence){
  if(!kana)return "";
  var t=toHira(String(kana)),out=[],i=0,n=t.length,prevKana="";
  while(i<n){
    var ch=t.charAt(i), nx=t.charAt(i+1), two=t.substr(i,2);
    /* 조사 は · へ (문장일 때만) */
    if(sentence&&ch==="は"&&haIsParticle(t,i)){out.push("와");prevKana="";i++;continue;}
    if(sentence&&i>0&&ch==="へ"&&!/^へや|^へん/.test(t.substr(i))){out.push("에");prevKana="";i++;continue;}
    /* 요음 */
    if(KPY[two]){out.push(KPY[two]);prevKana=two;i+=2;continue;}
    /* 촉음 */
    if(ch==="っ"){
      if(out.length&&nx){
        var g=koGem(out[out.length-1],nx);
        if(g)out[out.length-1]=g; else out.push("ㅅ");
      }
      prevKana=ch;i++;continue;
    }
    /* 장음 부호 */
    if(ch==="ー"){out.push("―");prevKana=ch;i++;continue;}
    /* ん */
    if(ch==="ん"){
      var nz=out.length?koNasal(out[out.length-1],nx):null;
      if(nz)out[out.length-1]=nz; else out.push("응");
      prevKana=ch;i++;continue;
    }
    /* 장음: お단+う · う단+う · え단+い · おお */
    if(prevKana&&KO_ROW[prevKana]){
      var v=KO_ROW[prevKana];
      var teDe=(prevKana==="て"||prevKana==="で");   /* ~ている 의 でい 는 장음이 아닙니다 */
      if((ch==="う"&&(v==="o"||v==="u"))||(ch==="お"&&v==="o"&&isLongO(t,i))||
         (ch==="い"&&v==="i")||(ch==="い"&&v==="e"&&!teDe)){
        out.push("―");prevKana=ch;i++;continue;
      }
    }
    /* 요음 뒤의 장음 — きょう · しゅう 등 */
    if(KPY[prevKana]&&(ch==="う")){out.push("―");prevKana=ch;i++;continue;}
    if(KPR[ch]){out.push(KPR[ch]);prevKana=ch;i++;continue;}
    out.push(ch);prevKana=ch;i++;
  }
  return out.join("");
}
function koPronS(kana){return koPron(kana,true);}

/* ===== 한자 표기를 보고 조사 は 를 정확히 가려냅니다 =====
   한자줄에서 KMAP 단어로 묶이지 않고 홀로 남은 は 가 조사입니다. */
function koPronPair(jp,kana){
  if(!jp)return koPron(kana||"");
  var t=String(jp),i=0,n=t.length,segs=[],L,seg,matched;
  while(i<n){
    matched=false;
    for(L=Math.min(7,n-i);L>=1;L--){
      seg=t.substr(i,L);
      if(KMAP[seg]){segs.push({k:KMAP[seg],p:false});i+=L;matched=true;break;}
    }
    if(matched)continue;
    var ch=t.charAt(i);
    if(KANJI.test(ch))return null;                 /* 모르는 한자 — 실패 */
    if(ch==="は"){segs.push({k:"は",p:true});i++;continue;}   /* 홀로 선 は = 조사 */
    if(ch==="へ"){segs.push({k:"へ",p:true});i++;continue;}
    segs.push({k:ch,p:false});i++;
  }
  /* 조사를 제외한 나머지는 단어 단위로 변환 */
  var out="";
  for(i=0;i<segs.length;i++){
    if(segs[i].p){out+=(segs[i].k==="は"?"와":"에");continue;}
    /* 이어지는 비조사 구간을 묶어서 변환해야 장음·촉음이 바르게 처리됩니다 */
    var j=i,buf="";
    while(j<segs.length&&!segs[j].p){buf+=segs[j].k;j++;}
    out+=koPron(buf);
    i=j-1;
  }
  return out;
}
/* 한자줄이 있으면 그것으로, 없으면 가나만으로 */
function koSay(jp,kana){
  var a=koPronPair(jp,kana);
  if(a)return a;
  return koPron(kana||jp,true);
}

/* ===== YBM 기초 일본어 3 — 활용 엔진 ===== */
var U2I={"う":"い","く":"き","ぐ":"ぎ","す":"し","つ":"ち","ぬ":"に","ぶ":"び","む":"み","る":"り"};
var U2A={"う":"わ","く":"か","ぐ":"が","す":"さ","つ":"た","ぬ":"な","ぶ":"ば","む":"ま","る":"ら"};
var U2E={"う":"え","く":"け","ぐ":"げ","す":"せ","つ":"て","ぬ":"ね","ぶ":"べ","む":"め","る":"れ"};
var U2O={"う":"お","く":"こ","ぐ":"ご","す":"そ","つ":"と","ぬ":"の","ぶ":"ぼ","む":"も","る":"ろ"};
var TE1={"く":"いて","ぐ":"いで","う":"って","つ":"って","る":"って","む":"んで","ぶ":"んで","ぬ":"んで","す":"して"};
var TA1={"く":"いた","ぐ":"いだ","う":"った","つ":"った","る":"った","む":"んだ","ぶ":"んだ","ぬ":"んだ","す":"した"};
/* 모양은 2그룹인데 1그룹으로 활용하는 예외 */
var EXC1={"帰る":1,"入る":1,"知る":1,"切る":1,"走る":1,"要る":1,"減る":1,"滑る":1,"喋る":1,"蹴る":1,"参る":1,"握る":1,"限る":1};
var IROW="いきしちにひみりぎじぢびぴ", EROW="えけせてねへめれげぜでべぺ";

function vGroup(jp,kana){
  if(/する$/.test(jp)||jp==="する")return 3;
  if(jp==="来る"||kana==="くる")return 3;
  if(EXC1[jp])return 1;
  if(/る$/.test(kana)){
    var prev=kana.charAt(kana.length-2);
    if(IROW.indexOf(prev)>=0||EROW.indexOf(prev)>=0)return 2;
  }
  return 1;
}
/* form: masu, masen, mashita, masendeshita, te, ta, nai, nakatta, tari, nakattari,
         tai, takunai, takatta, takunakatta */
function goPrefix(jp){                      /* 한자 표기로만 판정합니다 */
  if(!/する$/.test(jp))return "お";
  return /^[\u4e00-\u9fff]+$/.test(jp.slice(0,-2))?"ご":"お";
}
function oGo(s,base,pre){
  if(/する$/.test(s))return pre+s.slice(0,-2);
  return pre+base;
}
function conjugate(jp,kana,form){
  var g=vGroup(jp,kana);
  function build(s,isKana){
    var last=s.charAt(s.length-1), stem=s.slice(0,-1), base, nstem, tstem, dstem;
    if(g===3){
      if(/する$/.test(s)){base=s.slice(0,-2)+"し";nstem=s.slice(0,-2)+"し";tstem=s.slice(0,-2)+"し";}
      else{ /* 来る */ base=isKana?"き":"来"; nstem=isKana?"こ":"来"; tstem=base; }
    }else if(g===2){
      base=stem;nstem=stem;tstem=stem;
    }else{
      base=stem+(U2I[last]||"");
      nstem=stem+(U2A[last]||"");
      tstem=stem;
    }
    var te,ta;
    if(g===3){ te=tstem+"て"; ta=tstem+"た"; }
    else if(g===2){ te=tstem+"て"; ta=tstem+"た"; }
    else if(jp==="行く"){ te=stem+"って"; ta=stem+"った"; }
    else { te=stem+(TE1[last]||"て"); ta=stem+(TA1[last]||"た"); }
    var nai=(jp==="ある"||s==="ある")?"ない":nstem+"ない";
    /* ===== 확장형: 가능·사역·수동·사역수동·의지·ば ===== */
    var poten,caus,pass,cpass,cpass2,vol,ba,sonkei;
    if(g===3){
      if(/する$/.test(s)){ var pre3=s.slice(0,-2);
        poten=pre3+"できる"; caus=pre3+"させる"; pass=pre3+"される";
        cpass=pre3+"させられる"; cpass2=cpass; vol=pre3+"しよう"; ba=pre3+"すれば"; sonkei=pass;
      }else{ var k3=isKana?"こ":"来";
        poten=k3+"られる"; caus=k3+"させる"; pass=k3+"られる";
        cpass=k3+"させられる"; cpass2=cpass; vol=k3+"よう";
        ba=(isKana?"く":"来")+"れば";          /* 来れば는 くれば로 읽습니다 */
        sonkei=pass;
      }
    }else if(g===2){
      poten=stem+"られる"; caus=stem+"させる"; pass=stem+"られる";
      cpass=stem+"させられる"; cpass2=cpass; vol=stem+"よう"; ba=stem+"れば"; sonkei=pass;
    }else{
      var est=stem+(U2E[last]||""), ost=stem+(U2O[last]||"");
      poten=est+"る"; caus=nstem+"せる"; pass=nstem+"れる";
      cpass=nstem+"せられる";
      cpass2=(last==="す")?cpass:nstem+"される";   /* す로 끝나면 される형 없음 */
      vol=ost+"う"; ba=est+"ば"; sonkei=pass;
    }
    function pol(v,neg,past){ /* る로 끝나는 파생동사를 ます체로 */
      var b=v.slice(0,-1);
      if(past)return neg?b+"ませんでした":b+"ました";
      return neg?b+"ません":b+"ます";
    }
    switch(form){
      case "istem":return base;
      case "poten":return poten;
      case "potenM":return pol(poten);
      case "potenN":return pol(poten,1);
      case "caus":return caus;
      case "causM":return pol(caus);
      case "causPast":return pol(caus,0,1);
      case "pass":return pass;
      case "passM":return pol(pass);
      case "passPast":return pol(pass,0,1);
      case "cpass":return cpass;
      case "cpass2":return cpass2;
      case "cpassPast":return pol(cpass,0,1);
      case "vol":return vol;
      case "volOmou":return vol+(isKana?"とおもいます":"と思います");
      case "ba":return ba;
      case "tara":return (g===3?(/する$/.test(s)?s.slice(0,-2)+"した":(isKana?"きた":"来た")):(g===2?stem+"た":(jp==="行く"?stem+"った":stem+(TA1[last]||"た"))))+"ら";
      case "jisho":return s;
      case "koto":return s+"ことができます";
      case "tsumori":return s+"つもりです";
      case "tsumoriN":return nai+"つもりです";
      case "sonkeiR":return pol(sonkei);
      case "oNaru":return oGo(s,base,goPrefix(jp))+"になります";
      case "oSuru":return oGo(s,base,goPrefix(jp))+"いたします";
      case "oKudasai":return oGo(s,base,goPrefix(jp))+"ください";
    }
    switch(form){
      case "masu":return base+"ます";
      case "masen":return base+"ません";
      case "mashita":return base+"ました";
      case "masendeshita":return base+"ませんでした";
      case "te":return te;
      case "ta":return ta;
      case "nai":return nai;
      case "nakatta":return nai.slice(0,-1)+"かった";
      case "tari":return ta+"り";
      case "nakattari":return nai.slice(0,-1)+"かったり";
      case "tai":return base+"たいです";
      case "takunai":return base+"たくないです";
      case "takatta":return base+"たかったです";
      case "takunakatta":return base+"たくなかったです";
    }
    return s;
  }
  return {jp:build(jp,false),kana:build(kana,true),g:g};
}
/* 명사 · な형용사 · い형용사 */
function ybNoun(w,form){   /* 명사·な형 공통 (어간 그대로) */
  switch(form){
    case "desu":return w+"です"; case "janai":return w+"じゃないです";
    case "deshita":return w+"でした"; case "janakatta":return w+"じゃなかったです";
    case "te":return w+"で"; case "ta":return w+"だった"; case "nai":return w+"じゃない";
    case "tari":return w+"だったり"; case "nakattari":return w+"じゃなかったり";
    case "to":return w+"だと"; case "nara":return w+"なら";
    case "ba":return w+"なら"; case "tara":return w+"だったら";
    case "mod":return w+"な"; case "adv":return w+"に";
  } return w;
}
function ybAdjI(w,form){      /* い형용사 (w는 い로 끝남) */
  var s=w.slice(0,-1);
  if(w==="いい"||w==="良い"){s="よ";}
  switch(form){
    case "desu":return w+"です"; case "janai":return s+"くないです";
    case "deshita":return s+"かったです"; case "janakatta":return s+"くなかったです";
    case "te":return s+"くて"; case "ta":return s+"かった"; case "nai":return s+"くない";
    case "tari":return s+"かったり"; case "nakattari":return s+"くなかったり";
    case "to":return w+"と"; case "nara":return w+"なら";
    case "ba":return s+"ければ"; case "tara":return s+"かったら";
    case "mod":return w; case "adv":return s+"く";
  } return w;
}

     "~てから는 조금 다릅니다. 동사가 아니라 조사 から가 붙는 것인데, '~하고 나서'라는 순서를 나타냅니다. お金を入れてからボタンを押します처럼 씁니다."],
 rows:[["~てみる","~해 보다 (시험 삼아)","タイに行ってみたいです"],
       ["~ておく","~해 두다 (미리 준비)","前もって予約しておきましょう"],
       ["~てしまう","~해 버리다 (완료·실수)","名前を忘れてしまいました"],
       ["~ていく","~해 가다 (앞으로 계속)","持っていきます"],
       ["~てから","~하고 나서 (순서)","お金を入れてからボタンを押します"]],
 ex:[["タイに行ってみたいです。","タイにいってみたいです。","태국에 가 보고 싶습니다."],
     ["前もって予約しておきましょう。","まえもってよやくしておきましょう。","미리 예약해 둡시다."],
     ["名前を忘れてしまいました。","なまえをわすれてしまいました。","이름을 잊어버렸습니다."],
     ["お金を入れてからボタンを押します。","おかねをいれてからボタンをおします。","돈을 넣고 나서 버튼을 누릅니다."]],
 trap:"앞 동사를 활용하려 하지 마세요. 行きますてみたい가 아니라 行ってみたいです입니다. て형은 그대로 두고 뒤에 붙은 동사만 바꿉니다. ~てしまう는 '다 해치웠다'와 '그만 그래 버렸다' 두 느낌이 다 있어서, 忘れてしまいました는 '깜빡 잊어버렸다'는 아쉬움이 담깁니다."}

{id:"c11",t:"순서 표현",sub:"~하고 나서 · 한 후에 · 하기 전에",cat:"junjo",
 how:[
 ["① 어느 순서인지 정한다","먼저 하는 일인지 나중에 하는 일인지에 따라 쓰는 말이 다릅니다.","",],
 ["② ~하고 나서는 てから","て형 + から. 앞 동작을 끝내고 다음으로 넘어갑니다.","食べ<b>てから</b>行きます"],
 ["③ ~한 후에는 た後で","た형 + 後(あと)で. てから보다 문어적입니다.","食べ<b>た後で</b>行きます"],
 ["④ ~하기 전에는 る前に","<b>사전형</b> + 前(まえ)に. 과거 문장이어도 앞은 사전형입니다.","食べ<b>る前に</b>行きました"]
],
 ko:["동작의 순서를 말하는 세 가지입니다. 앞에 붙는 형태가 각각 달라서 그것만 구분하면 됩니다.",
     "~てから는 て형에, ~た後で는 た형에 붙습니다. 둘 다 '먼저 A를 하고 그다음 B'라는 뜻이라 바꿔 써도 되는 경우가 많습니다. 다만 ~た後で는 앞 동작이 완전히 끝났다는 점을 더 분명히 합니다.",
     "~前に는 방향이 반대입니다. 'B보다 먼저 A를 한다'는 뜻이고, 앞에는 사전형이 옵니다. 여기서 실수가 가장 많이 나옵니다."],
 rows:[["~てから","て형 + から","お金を入れてからボタンを押します"],
       ["~た後で","た형 + 後で(あとで)","ご飯を食べた後で、コーヒーを飲みます"],
       ["~前に","사전형 + 前に(まえに)","寝る前に、歯を磨きます"],
       ["주의","前に 앞은 항상 사전형","食べた前に ✗ → 食べる前に ○"]],
 ex:[["ご飯を食べた後で、薬を飲みました。","ごはんをたべたあとで、くすりをのみました。","밥을 먹은 후에 약을 먹었습니다."],
     ["寝る前に、本を読みます。","ねるまえに、ほんをよみます。","자기 전에 책을 읽습니다."],
     ["手を洗ってから、食べましょう。","てをあらってから、たべましょう。","손을 씻고 나서 먹읍시다."]],
 trap:"前に 앞을 과거형으로 쓰지 마세요. 문장 전체가 과거여도 앞은 사전형 그대로입니다. 昨日、寝る前に本を読みました처럼 씁니다. 반대로 後で 앞은 반드시 た형이라, 食べる後で가 아니라 食べた後で입니다."}
,
{id:"c12",t:"자동사 · 타동사와 상태",sub:"~ている · ~てある (17과)",cat:"jita",
 how:[
 ["① 자동사인지 타동사인지 본다","が가 붙으면 자동사(저절로), を가 붙으면 타동사(누가 한다).","ドア<b>が</b>開く / ドア<b>を</b>開ける"],
 ["② 자동사 + ている = 지금 그 상태","문이 열려 있는 '모습'을 말합니다.","ドアが開いています"],
 ["③ 타동사 + てある = 누가 해 둔 결과","누군가 일부러 그렇게 해 두었다는 뜻이 담깁니다.","ドアが開けてあります"],
 ["④ 짝으로 외운다","하나씩 외우지 말고 開く·開ける처럼 짝으로 외워야 머리에 남습니다.","付く·付ける / 消える·消す / 閉まる·閉める"]
],
 ko:["자동사는 '~가 ~하다', 타동사는 '~를 ~하다'입니다. 문이 저절로 열리면 ドアが開く, 김 씨가 문을 열면 金さんがドアを開ける. 같은 장면을 누가 했는지에 따라 동사가 바뀝니다.",
     "짝을 구별하는 요령은 두 가지입니다. る와 す의 짝이면 す 쪽이 타동사입니다(出る / 出す). 둘 다 る로 끝나면 2그룹 쪽이 타동사입니다(閉まる / 閉める).",
     "상태를 말할 때 두 표현이 있습니다. 자동사て いる는 지금 눈에 보이는 모습을 그대로 묘사합니다. 타동사て ある는 누군가 일부러 해 둔 결과라는 느낌이 들어갑니다. 이때 조사가 を에서 が로 바뀌는 것에 주의하세요."],
 rows:[["자동사 + ている","~가 ~해 있다 (보이는 상태)","ドアが開いています"],
       ["타동사 + てある","~가 ~해져 있다 (해 둔 결과)","ドアが開けてあります"],
       ["구별 ①","る · す 짝 → す가 타동사","出る / 出す"],
       ["구별 ②","둘 다 る → 2그룹이 타동사","閉まる / 閉める"]],
 ex:[["ドアが開いています。","ドアがあいています。","문이 열려 있습니다."],
     ["ドアが開けてあります。","ドアがあけてあります。","문이 열려져 있습니다. (누가 열어 둠)"],
     ["電気が消えています。","でんきがきえています。","전등이 꺼져 있습니다."],
     ["車が止めてあります。","くるまがとめてあります。","차가 세워져 있습니다."]],
 trap:"~てある 앞에서도 を를 쓰기 쉽습니다. ドアを開けてあります가 아니라 ドアが開けてあります입니다. 타동사지만 상태를 말하는 순간 주어가 '문'이 되기 때문이에요. 그리고 ~ている는 자동사, ~てある는 타동사에만 붙습니다."}

     "くれる는 나뿐 아니라 내 가족에게 줄 때도 씁니다. 田中さんは妹に本をくれました처럼요. 동생은 내 쪽 사람이니까요.",
     "て형에 붙이면 '물건'이 아니라 '행동'을 주고받는 말이 됩니다. 貸してあげる(빌려주다), 教えていただく(가르쳐 받다 = 배우다), 買ってくれる(사 주다)처럼요."],
 rows:[["나 → 남","あげる (높임 さしあげる)","私は友だちにカードをあげました"],

       ["높임 정리","いただく 받다 (높은분에게서)","もらう는 동등한 사람에게서"]],

 rows:[["ます형 어간 +","ながら(~하면서) · に行く(~하러 가다) · 方(~하는 법)","読みながら · 買いに行く · 読み方"],

 ex:[["音楽を聞きながら勉強します。","おんがくをききながらべんきょうします。","음악을 들으면서 공부합니다."],
     ["ここで写真を撮ってもいいですか。","ここでしゃしんをとってもいいですか。","여기서 사진을 찍어도 되나요?"],
     ["日本へ行ったことがあります。","にほんへいったことがあります。","일본에 간 적이 있습니다."],

function flabel(q){

  if(q.kind==="youda")return q.form==="y_you"?"~ようです (추측·비유)":"~みたいです (회화체)";
  if(q.kind==="futsu")return "보통형으로 바꾸기 · "+(FTENSE[q.form]||"");
  if(q.kind==="denbun")return {dn_sou:"~そうです (전문 · ~래요)",dn_rashii:"~らしいです (추측 · ~인 것 같아요)",dn_rashii2:"~らしい (~답다)"}[q.form]||"";
  if(q.kind==="bunkei")return (BUNKEI[q.form]?BUNKEI[q.form].t+" ("+BUNKEI[q.form].ko+")":"");
  if(q.kind==="juju")return {ju_ageru:"あげる (나 → 남)",ju_morau:"もらう (받다)",ju_kureru:"くれる (남 → 나)",ju_keigo:"높임말",ju_te:"~て + 주고받기"}[q.form]||"";
  if(q.kind==="aru")return q.form==="ar_pos"?"あります · います":"ありません · いません";
  if(q.kind==="date")return {d_month:"몇 월",d_day:"며칠",d_week:"요일"}[q.form]||"";
  if(q.kind==="jita")return {jt1:"자동사 → 타동사",jt2:"타동사 → 자동사",jt3:"자동사 + ている",jt4:"타동사 + てある"}[q.form]||"";
  if(q.kind==="junjo")return (JUNJO[q.form]?JUNJO[q.form].t+" ("+JUNJO[q.form].ko+")":"");
  if(q.kind==="hojo")return (HOJO[q.form]?HOJO[q.form].t+" ("+HOJO[q.form].ko+")":"");
  if(q.kind==="v9")return (V9[q.form]?V9[q.form][0]+" ("+V9[q.form][1]+")":"");
  if(q.kind==="jouken")return {j_to:"と (일반조건)",j_nara:"なら (권유·추천)",j_ba:"ば (가정)",j_tara:"たら (회화체)"}[q.form]||"";
  if(q.kind==="keigo")return q.form==="kg_son"?"존경어 (상대를 올림)":"겸양어 (나를 낮춤)";
  if(q.kind==="deshou")return DSLOT[q.form]||"";return (q.kind==="p"?PLABEL[q.form]:VLABEL[q.form])||"";}

var KMAP=(function(){
  var m={},a=KRAW.split(","),i,kv;
  for(i=0;i<a.length;i++){kv=a[i].split(":");if(kv.length===2)m[kv[0]]=kv[1];}
  return m;
})();
var KANJI=/[\u4E00-\u9FFF\u3005]/;

/* 한자 뒤에 (읽기)를 붙인다 */
function furiInline(t){
  if(!t||!KANJI.test(t))return t;
  var out="",i=0,n=t.length,L,seg,matched;
  while(i<n){
    matched=false;
    for(L=Math.min(7,n-i);L>=1;L--){
      seg=t.substr(i,L);
      if(KMAP[seg]&&KANJI.test(seg)){out+=seg+"("+KMAP[seg]+")";i+=L;matched=true;break;}
    }
    if(!matched){out+=t.charAt(i);i++;}
  }
  return out;
}
/* 문장 전체를 가나로 바꾼다. 모르는 한자가 남으면 빈 문자열 */
function furiRead(t){
  if(!t)return "";
  if(!KANJI.test(t))return t;
  var out="",i=0,n=t.length,L,seg,matched;
  while(i<n){
    matched=false;
    for(L=Math.min(7,n-i);L>=1;L--){
      seg=t.substr(i,L);
      if(KMAP[seg]){out+=KMAP[seg];i+=L;matched=true;break;}
    }
    if(!matched){
      if(KANJI.test(t.charAt(i)))return "";
      out+=t.charAt(i);i++;
    }
  }
  return out;
}

var recRef=null;
function listen(onDone){
  if(!SR){S.micErr="이 브라우저는 음성 인식을 지원하지 않습니다. 크롬에서 열어 주세요.";render();return false;}
  try{
    if(recRef){try{recRef.abort();}catch(e0){}}
    var r=new SR();recRef=r;
    r.lang="ja-JP";r.interimResults=false;r.maxAlternatives=3;
    S.micOn=true;S.micErr="";render();
    r.onresult=function(e){
      var alts=[],i;
      for(i=0;i<e.results[0].length;i++)alts.push(e.results[0][i].transcript);
      S.micOn=false;onDone(alts);
    };
    r.onerror=function(e){
      S.micOn=false;
      S.micErr=e.error==="not-allowed"?"마이크 권한이 막혀 있어요. 주소창 왼쪽 자물쇠에서 마이크를 허용해 주세요.":"소리를 못 들었어요. 다시 눌러 주세요.";
      render();
    };
    r.onend=function(){if(S.micOn){S.micOn=false;render();}};
    r.start();
    return true;
  }catch(e){S.micErr="마이크를 열 수 없습니다.";S.micOn=false;render();return false;}
}
function bestOf(alts,list){
  var best=0,txt=(alts&&alts[0])||"",i,j;
  for(i=0;i<alts.length;i++)for(j=0;j<list.length;j++){
    var sc=similarity(normAns(alts[i]),normAns(list[j]));
    if(sc>best){best=sc;txt=alts[i];}
  }
  return {t:txt,s:best};
}
/* 음성은 표기가 흔들리므로 유사도로 판정한다 */
function judgeVoice(alts,cands){
  var b=bestOf(alts,cands);
  return {res:b.s>=85?2:(b.s>=62?1:0),text:b.t,score:b.s};
}

}

var DAY=86400000, INT=[0,1,2,4,8,16,32], NEWN=8;
function buildQueue(){
  var now=Date.now(),due=[],fresh=[],i,c;
  for(i=0;i<PHRASES.length;i++){c=PHRASES[i];
    if(S.srs[c.id]){if(S.srs[c.id].due<=now)due.push(c);}
    else if(fresh.length<NEWN)fresh.push(c);}
  S.queue=shuffle(due.concat(fresh));S.qi=0;S.open=false;S.recScore=null;S.recHeard="";
}
function gradeCard(g){
  var c=S.queue[S.qi],prev=S.srs[c.id],box=prev?prev.box:0,nb;
  if(g==="again")nb=0; else if(g==="good")nb=Math.min(box+1,INT.length-1); else nb=Math.min(box+2,INT.length-1);
  S.srs[c.id]={box:nb,due:Date.now()+INT[nb]*DAY,seen:(prev?prev.seen:0)+1};
  saveSrs();
  if(g==="again")S.queue.push(c);
  S.qi++;S.open=false;S.recScore=null;S.recHeard="";S.recErr="";
  render();
}

/* ============================ 활용 드릴 ============================ */
function conjI(e,f){
  if(e.irr)return [["いいです","いいです"],["よくないです","よくないです"],["よかったです","よかったです"],["よくなかったです","よくなかったです"]][f];
  var s=e.w.slice(0,-1),sk=e.k.slice(0,-1);
  return [[e.w+"です",e.k+"です"],[s+"くないです",sk+"くないです"],[s+"かったです",sk+"かったです"],[s+"くなかったです",sk+"くなかったです"]][f];
}
function conjNa(e,f){
  return [[e.w+"です",e.k+"です"],[e.w+"じゃないです",e.k+"じゃないです"],[e.w+"でした",e.k+"でした"],[e.w+"じゃなかったです",e.k+"じゃなかったです"]][f];
}
function conjV(e,f){
  var s=e.m.slice(0,-2),sk=e.k.slice(0,-2);
  return [[e.m,e.k],[s+"ません",sk+"ません"],[s+"ました",sk+"ました"],[s+"ませんでした",sk+"ませんでした"]][f];
}
function makeDrill(){
  S.dHint=false;
  var last=S.dItem?S.dItem.key:null,tries,it;
  for(tries=0;tries<14;tries++){
    var m=S.dMode==="mix"?pick(["i","na","v","p"]):S.dMode;
    if(m==="p"){
      var e=pick(PARTICLES);
      it={mode:"p",key:"p"+e.jp.join(),ko:e.ko,jp:e.jp[0]+e.a+e.jp[1],kana:e.k[0]+e.a+e.k[1],
          answer:e.a,opts:e.o,why:e.w,label:"조사"};
    }else{
      var forms=S.dForms.length?S.dForms:[0,1,2,3],f=pick(forms);
      var bank=m==="i"?I_ADJ:(m==="na"?NA_ADJ:VERBS),b=pick(bank);
      var c=m==="i"?conjI(b,f):(m==="na"?conjNa(b,f):conjV(b,f));
      it={mode:m,key:m+(b.w||b.m)+f,ko:b.ko[f],jp:b.pre+c[0],kana:b.preK+c[1],
          label:(m==="i"?"い형용사":(m==="na"?"な형용사":"동사 ます"))+" · "+FORMS[f]};
    }
    if(it.key!==last)break;
  }
  S.dItem=it;S.dRev=false;S.dPicked=null;
}
var runId=0;
function drillLoop(){
  var id=++runId;
  (async function(){
    while(id===runId&&S.dPlay){
      S.dPhase="think";S.dRev=false;S.dVoice=null;render();
      if(S.dMicOn&&SR){
        await new Promise(function(res){
          var settled=false,fin=function(){if(!settled){settled=true;res();}};
          var started=listen(function(alts){
            S.dVoice=judgeVoice(alts,[S.dItem.jp,S.dItem.kana]);
            S.dVoice={s:S.dVoice.score,t:S.dVoice.text};
            fin();
          });
          if(!started)fin();
          setTimeout(fin,S.dWait+1500);
        });
      }else{
        await sleep(S.dWait);
      }
      if(id!==runId||!S.dPlay)return;
      S.dRev=true;S.dPhase="speak";render();
      for(var r=0;r<S.dReps;r++){
        if(id!==runId||!S.dPlay)return;
        await say(S.dItem.jp,S.dRate);
        await sleep(600);
      }
      if(id!==runId||!S.dPlay)return;
      S.dPhase="repeat";render();
      await sleep(S.dWait);
      if(id!==runId||!S.dPlay)return;
      S.dCount++;S.total++;saveTotal();
      makeDrill();
    }
  })();
}

function makeSentence(maxDay){
  function ok(x){return x.d<=maxDay;}
  var time=T_TIME.filter(ok),date=T_DATE.filter(ok),wea=T_WEA.filter(ok),pl=T_PLACE.filter(ok),
      vde=V_DE.filter(ok),vhe=V_HE.filter(ok),fd=T_FOOD.filter(ok),kinds=[];
  if(date.length&&wea.length)kinds.push("w");
  if(time.length&&pl.length&&vde.length)kinds.push("r");
  if(date.length&&pl.length&&vhe.length)kinds.push("m");
  if(time.length&&fd.length)kinds.push("f");
  var time2=time.filter(function(x){return !x.noE;});
  if(date.length&&time2.length&&pl.length&&vde.length)kinds.push("a");
  if(!kinds.length)return null;
  var kind=pick(kinds),d,t,p,v,w,f,past,tail,tailK,conj,conjK;
  if(kind==="w"){
    d=pick(date);w=pick(wea);past=!!d.past;
    tail=w.adj?(past?w.jp.slice(0,-1)+"かったです":w.jp+"です"):(past?w.jp+"でした":w.jp+"です");
    tailK=w.adj?(past?w.k.slice(0,-1)+"かったです":w.k+"です"):(past?w.k+"でした":w.k+"です");
    return {chunks:[{jp:d.jp+"は",k:d.k+"は"},{jp:tail,k:tailK}],ko:eun(d.ko)+" "+(past?w.t:w.p),tag:"날짜 + 날씨"};
  }
  if(kind==="r"){
    v=pick(vde);t=pick(time);p=pick(fitPlace(pl,v));
    return {chunks:[{jp:t.jp+(t.ni?"に":"、"),k:t.k+(t.ni?"に":"、")},{jp:p.jp+"で",k:p.k+"で"},{jp:v.jp,k:v.k}],
            ko:(t.noE?t.ko:t.ko+"에")+" "+p.ko+"에서 "+v.p[0],tag:"시간 + 장소 + 동작"};
  }
  if(kind==="m"){
    v=pick(vhe);d=pick(date);p=pick(fitPlace(pl,v));past=!!d.past;
    conj=past?v.jp.slice(0,-2)+"ました":v.jp;conjK=past?v.k.slice(0,-2)+"ました":v.k;
    return {chunks:[{jp:d.jp+(d.ni?"に":"は"),k:d.k+(d.ni?"に":"は")},{jp:p.jp+"へ",k:p.k+"へ"},{jp:conj,k:conjK}],
            ko:(d.ni?d.ko+"에":eun(d.ko))+" "+p.ko+"에 "+v.p[past?1:0],tag:"날짜 + 장소 + 이동"};
  }
  if(kind==="f"){
    t=pick(time);f=pick(fd);
    return {chunks:[{jp:t.jp+(t.ni?"に":"、"),k:t.k+(t.ni?"に":"、")},{jp:f.jp+"を",k:f.k+"を"},
            {jp:f.dr?"飲みます":"食べます",k:f.dr?"のみます":"たべます"}],
            ko:(t.noE?t.ko:t.ko+"에")+" "+eul(f.ko)+" "+(f.dr?"마셔요":"먹어요"),tag:"시간 + 음식"};
  }
  v=pick(vde);d=pick(date);t=pick(time2);p=pick(fitPlace(pl,v));past=!!d.past;
  conj=past?v.jp.slice(0,-2)+"ました":v.jp;conjK=past?v.k.slice(0,-2)+"ました":v.k;
  return {chunks:[{jp:d.jp+"の"+t.jp+(t.ni?"に":"、"),k:d.k+"の"+t.k+(t.ni?"に":"、")},{jp:p.jp+"で",k:p.k+"で"},{jp:conj,k:conjK}],
          ko:d.ko+" "+t.ko+"에 "+p.ko+"에서 "+v.p[past?1:0],tag:"날짜 + 시간 + 장소 + 동작"};
}

function viewScene(){
  var h="",i;
  if(S.scIdx===null){
    h+='<div class="card" style="margin-bottom:12px"><div class="tag mono">상황 대화</div>'+
       '<div class="body">점원이나 행인이 말을 겁니다. 세 개의 답 중 자연스러운 것을 고르세요. 정답이 둘인 경우도 있습니다.</div></div>';
    var cats=["일상","여행"],ci;
    for(ci=0;ci<cats.length;ci++){
    h+='<div class="lab" style="margin-top:12px">'+cats[ci]+(cats[ci]==="일상"?" — 배운 문법으로 주고받기":" — 가게 · 길 · 호텔")+'</div><div class="glist">';
    for(i=0;i<SCENES.length;i++){
      if(SCENES[i].cat!==cats[ci])continue;
      h+='<button data-a="scopen" data-v="'+i+'"><span><h4>'+SCENES[i].icon+' '+esc(SCENES[i].t)+'</h4>'+
         '<p>'+esc(SCENES[i].sub)+' · '+SCENES[i].turns.length+'턴</p></span>'+
         (S.scDone[i]?'<span class="badge">완료</span>':'<span class="badge" style="border-color:var(--line);color:#8A9CBE">시작</span>')+'</button>';
    }
    h+='</div>';
    }
    return h;
  }
  var sc=SCENES[S.scIdx];
  if(S.scTurn>=sc.turns.length){
    S.scDone[S.scIdx]=1;
    h+='<div class="empty"><b>'+sc.icon+' '+esc(sc.t)+' 대화 완료</b>'+
       '한 번 더 돌리면서 이번엔 소리 내어 말해 보세요.'+
       '<div class="row" style="margin-top:14px"><button class="btn" data-a="scclose">다른 상황</button>'+
       '<button class="btn main" data-a="scopen" data-v="'+S.scIdx+'">다시 하기</button></div></div>';
    return h;
  }
  var t=sc.turns[S.scTurn];
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
     '<button class="link" data-a="scclose">← 상황 목록</button>'+
     '<span class="mono" style="font-size:16px;color:#8A9CBE">'+(S.scTurn+1)+' / '+sc.turns.length+'</span></div>';
  h+='<div class="bar"><i style="width:'+(S.scTurn/sc.turns.length*100)+'%"></i></div>';
  h+='<div class="card"><div class="tag mono">'+sc.icon+' '+esc(sc.t)+' · 상대</div>'+
     '<div style="font-size:18px;color:var(--dim)">'+esc(t.n[1])+'</div>'+
     '<div style="font-size:30px;font-weight:900;line-height:1.4">'+esc(t.n[0])+'</div>'+
     '<div style="font-size:19px;color:#C6D0E2;margin-top:6px">'+esc(t.n[2])+'</div>'+
     '<div class="pill" style="justify-content:flex-start"><button data-a="say" data-v="'+esc(sayText(t.n[0],t.n[1]))+'">▶ 듣기</button>'+
     '<button data-a="sayslow" data-v="'+esc(sayText(t.n[0],t.n[1]))+'">느리게</button></div></div>';
  h+='<div class="lab" style="margin-top:14px">뭐라고 답할까요</div>';
  for(i=0;i<t.o.length;i++){
    var cls="opt";
    if(S.scPicked!==null){
      if(t.o[i][3])cls+=" right";
      else if(S.scPicked===i)cls+=" wrong";
    }
    h+='<button class="'+cls+'" '+(S.scPicked!==null?"disabled":"")+' data-a="scpick" data-v="'+i+'">'+
       '<div style="font-size:17px;color:#8A9CBE">'+esc(t.o[i][1])+'</div>'+
       '<div style="font-size:25px;font-weight:800">'+esc(t.o[i][0])+'</div>'+
       (S.scPicked!==null?'<div style="font-size:17px;color:#C6D0E2;margin-top:4px">'+esc(t.o[i][2])+'</div>'+
         '<div style="font-size:16px;color:'+(t.o[i][3]?"#7ED9A6":"#F0A091")+';margin-top:4px">'+esc(t.o[i][4])+'</div>':"")+
       '</button>';
  }
  if(S.scPicked!==null){
    var chosen=t.o[S.scPicked];
    h+='<div class="row">'+
       '<button class="btn" data-a="say" data-v="'+esc(sayText(chosen[0],chosen[1]))+'">내 대사 듣기</button>'+
       (SR?'<button class="btn" data-a="scmic" data-v="'+S.scPicked+'">🎙 따라 말하기</button>':"")+
       '<button class="btn main" data-a="scnext">다음 →</button></div>'+micNote();
    if(S.scVoice)h+='<div style="text-align:center;margin-top:10px;font-size:19px;color:'+
       (S.scVoice.s>=80?"#7ED9A6":(S.scVoice.s>=55?"#F0C560":"#F0A091"))+'">발음 '+S.scVoice.s+'점 · 들린 말: '+esc(S.scVoice.t)+'</div>';
  }
  return h;
}

function radOf(k){
  for(var i=0;i<RADS.length;i++)if(RADS[i][4].indexOf(k)>=0)return RADS[i];
  return null;
}
function radHint(jp){
  var out=[],seen={},i,k,r;
  for(i=0;i<jp.length;i++){
    k=jp.charAt(i);
    if(k<"\u4e00"||k>"\u9fff")continue;
    if(seen[k])continue;seen[k]=1;
    r=radOf(k);
    if(r)out.push(esc(k)+'<b>'+esc(r[0])+'</b>'+esc(r[2]));
  }
  return out.length?out.join(" \u00b7 "):"";
}
function radHintRow(jp){
  var t=radHint(jp);
  return t?'<div class="radhint">부수 '+t+'</div>':"";
}
function radWords(kanjiList){
  /* 앱 단어 전체에서 그 한자가 들어간 단어를 모은다 */
  var pool=CLASSW.concat(N5VERBS,TRAVELW,S.my||[]),out=[],seen={},i,j,w;
  COURSE.forEach(function(c){c.w.forEach(function(x){pool.push({jp:x[0],kana:x[1],ko:x[2]});});});
  for(i=0;i<pool.length;i++){
    w=pool[i];
    for(j=0;j<kanjiList.length;j++){
      if(w.jp.indexOf(kanjiList.charAt(j))>=0&&!seen[w.jp]){seen[w.jp]=1;out.push(w);break;}
    }
  }
  return out;
}

/* ============ 날짜별 암기 기록 ============ */
function dParse(ds){
  /* "2026-11-3" 같은 문자열은 자리수에 따라 UTC로도 로컬로도 해석됩니다.
     직접 만들어 그 차이를 없앱니다. */
  var a=String(ds).split("-");
  return new Date(parseInt(a[0],10),parseInt(a[1],10)-1,parseInt(a[2],10));
}
function dkey(ds){ /* "2026-11-2" → 정렬용 숫자 */
  var a=String(ds).split("-");
  return parseInt(a[0],10)*10000+parseInt(a[1],10)*100+parseInt(a[2],10);
}
function dLabel(ds){var a=String(ds).split("-");return parseInt(a[1],10)+"월 "+parseInt(a[2],10)+"일";}
function dWeekday(ds){
  return ["일","월","화","수","목","금","토"][dParse(ds).getDay()]+"요일";
}
function dDiff(ds){
  var d=dParse(ds),n=new Date();
  n=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.round((n-d)/86400000);
}
/* 날짜 → 그날 외운 단어들 */
function histByDay(){
  var map={},pool=allWords(),i,k,ds,out=[];
  for(i=0;i<pool.length;i++){
    k=wkey(pool[i]);ds=S.hist[k];
    if(!ds)continue;
    if(!map[ds])map[ds]=[];
    map[ds].push(pool[i]);
  }
  Object.keys(map).forEach(function(d){out.push({date:d,words:map[d]});});
  out.sort(function(a,b){return dkey(b.date)-dkey(a.date);});
  return out;
}
/* 연속 학습 일수 */
function streakDays(){
  var days=histByDay().map(function(x){return dkey(x.date);}),set={},i;
  days.forEach(function(d){set[d]=1;});
  var n=0,probe=new Date();
  for(i=0;i<400;i++){
    var k=probe.getFullYear()*10000+(probe.getMonth()+1)*100+probe.getDate();
    if(set[k])n++;
    else if(i>0)break;           /* 오늘 아직 안 했으면 어제부터 셉니다 */
    probe.setDate(probe.getDate()-1);
  }
  return n;
}

var CH_THEMES=[
  ["v","동사","사전형·ます형·て형까지 그대로 변형 훈련으로 이어집니다"],
  ["i","い형용사","い로 끝나고 です만 붙이면 정중형이 되는 말"],
  ["na","な형용사","명사를 꾸밀 때 な가 들어가는 말"],
  ["n","명사 · 생활/여행","가게·교통·음식처럼 실제로 자주 쓰는 이름"],
  ["set","맞춤 구성","동사 3 · い형용사 2 · な형용사 2 · 명사 3 (총 10개)"],
  ["mix","섞어서","품사를 가리지 않고 골고루"]
];
/* 맞춤 구성 — 숫자만 고치면 구성이 바뀝니다 (나머지 칸은 품사 상관없이 채움) */
var CH_RECIPE=[["v",3],["i",2],["na",2],["n",3]];
function chThemeName(th){
  for(var i=0;i<CH_THEMES.length;i++)if(CH_THEMES[i][0]===th)return CH_THEMES[i][1];
  return "섞어서";
}
var TRAVELSET=null;
function chPool(th){
  var all=allWords();
  if(!th||th==="mix")return all;
  if(th==="n"){
    if(!TRAVELSET){TRAVELSET={};TRAVELW.forEach(function(w){TRAVELSET[wkey(w)]=1;});}
    var pri=all.filter(function(w){return wPos(w)==="n"&&(/^생활/.test(w.tag||"")||TRAVELSET[wkey(w)]);});
    if(pri.length>=20)return pri;
    return all.filter(function(w){return wPos(w)==="n";});
  }
  var r=all.filter(function(w){return wPos(w)===th;});
  return r.length>=10?r:all;
}
function chThemeAuto(){        /* 기본은 맞춤 구성(동사3·い2·な2·명사3) */
  return "set";
}
function chBuildSet(){
  var all=allWords().filter(function(w){return wPos(w)!=="adv";}),i,k,out=[],used={};
  function freshOf(t){
    var a=all.filter(function(w){return (!t||wPos(w)===t)&&!used[wkey(w)];});
    var f=a.filter(function(w){return !S.hist[wkey(w)];});
    return shuffle(f.length>=1?f:a);
  }
  CH_RECIPE.forEach(function(rc){
    var c=freshOf(rc[0]).slice(0,rc[1]);
    c.forEach(function(w){used[wkey(w)]=1;out.push(w);});
  });
  var rest=10-out.length;
  if(rest>0)freshOf(null).slice(0,rest).forEach(function(w){used[wkey(w)]=1;out.push(w);});
  return out;
}
function chTheme(){
  if(S.ch&&S.ch.date===todayStr()&&S.ch.theme)return S.ch.theme;
  return chThemeAuto();
}
function ensureChallenge(force){
  if(!force&&S.ch&&S.ch.date===todayStr()&&S.ch.ids&&S.ch.ids.length&&S.ch.theme&&S.ch.rv===3)return;
  var th=force||((S.ch&&S.ch.rv===3)?chTheme():"set");
  var pool=chPool(th),fresh=[],i,k;
  if(th==="set"){fresh=chBuildSet();}
  else{
    for(i=0;i<pool.length;i++){k=wkey(pool[i]);if(!S.hist[k])fresh.push(pool[i]);}
    if(fresh.length<10)fresh=pool.slice();
    fresh=shuffle(fresh).slice(0,10);
  }
  S.ch={date:todayStr(),theme:th,rv:3,ids:fresh.map(wkey),cnt:(S.ch&&S.ch.cnt)||{}};
  saveCh();
}
function chWords(){
  var map={},pool=allWords(),i;
  for(i=0;i<pool.length;i++)map[wkey(pool[i])]=pool[i];
  return (S.ch.ids||[]).map(function(k){return map[k];}).filter(Boolean);
}
/* 오늘 한 활동 — 홈에서 진행 상황을 보여주기 위해 기록합니다 */
function dayStat(){
  if(!S.day||S.day.date!==todayStr())S.day={date:todayStr(),drill:0,read:0,test:0};
  return S.day;
}
function dayBump(kind,n){

  S.day=d;LS.set("jp.day",d);
}
function chHits(){            /* 오늘 맞힌 총 횟수 (단어당 최대 3) */
  var w=chWords(),n=0;
  for(var i=0;i<w.length;i++)n+=Math.min(3,S.ch.cnt[wkey(w[i])]||0);
  return n;
}
function chGoal(){return chWords().length*3;}
function chRemaining(){
  return chWords().filter(function(w){return (S.ch.cnt[wkey(w)]||0)<3;});
}
function chMake(fixW,fixStage){
  var rem=chRemaining();
  if(!rem.length&&!fixW){S.chQ=null;return;}
  var w=fixW||pick(rem),stage=(fixStage!==undefined&&fixStage!==null)?fixStage:(S.ch.cnt[wkey(w)]||0),pool=allWords();
  var others=shuffle(pool.filter(function(x){return x.ko!==w.ko&&x.jp!==w.jp;})).slice(0,3);
  if(stage===0)
    S.chQ={w:w,stage:0,prompt:w.jp,sub:(w.jp!==w.kana?w.kana:""),ask:"뜻을 고르세요",
           opts:shuffle([w.ko].concat(others.map(function(x){return x.ko;}))),ans:w.ko};
  else if(stage===1){
    var cands=[w].concat(others),map={};
    cands.forEach(function(x){map[x.jp]=(x.jp!==x.kana)?x.kana:"";});
    var op=shuffle(cands.map(function(x){return x.jp;}));
    S.chQ={w:w,stage:1,prompt:w.ko,sub:"",ask:"일본어를 고르세요",
           opts:op,optK:op.map(function(j){return map[j]||"";}),ans:w.jp};
  }
  else
    S.chQ={w:w,stage:2,prompt:w.ko,sub:"",ask:"일본어로 직접 쓰거나 말하세요",
           ok:[w.jp,w.kana,romaji(w.kana)],ans:w.jp};
  S.chPicked=null;S.chRes=null;S.chInput="";
}
function chScore(ok){
  var k=wkey(S.chQ.w);
  if(ok){
    S.ch.cnt[k]=(S.ch.cnt[k]||0)+1;
    if(S.ch.cnt[k]>=3&&!S.hist[k]){S.hist[k]=todayStr();saveHist();}
    saveCh();
  }

function weekWords(days){
  var t=new Date(),today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  var out=[],pool=allWords(),i,k,d;
  for(i=0;i<pool.length;i++){
    k=wkey(pool[i]);
    if(!S.hist[k])continue;
    d=dParse(S.hist[k]);
    var diff=Math.round((today-d)/86400000);
    if(diff>=0&&diff<days)out.push(pool[i]);
  }
  return out;
}

/* ============================ 단어장 · 카드 맞추기 ============================ */
function wordPool(src){
  var out=[],i,j;
  if(src==="class")return CLASSW.slice();
  if(src==="today"){ensureChallenge();out=chWords();if(out.length>=6)return out;}
  if(src==="my"&&S.my.length>=6)return S.my.slice();
  if(src==="learned"||src==="today"||src==="my"){
    for(i=0;i<COURSE.length;i++)if(S.course[COURSE[i].d])
      for(j=0;j<COURSE[i].w.length;j++)
        out.push({jp:COURSE[i].w[j][0],kana:COURSE[i].w[j][1],ko:COURSE[i].w[j][2],en:""});
    if(out.length<6)
      for(i=0;i<3;i++)for(j=0;j<COURSE[i].w.length;j++)
        out.push({jp:COURSE[i].w[j][0],kana:COURSE[i].w[j][1],ko:COURSE[i].w[j][2],en:""});
  }
  else if(src==="verb")out=N5VERBS.slice();
  else out=TRAVELW.slice();
  return out;
}
function newGame(){
  var pool=wordPool(S.gSrc),i,picked=[],cards=[];
  if(S.gMode==="read")pool=pool.filter(function(w){return w.jp!==w.kana;});
  pool=shuffle(pool);
  for(i=0;i<pool.length&&picked.length<6;i++){
    var w=pool[i],a,b,as,bs;
    var rd=(w.jp!==w.kana)?w.kana:"";      /* 실제로 쓰는 읽기만 */
    if(S.gMode==="mean"){a=w.jp;as=rd;b=w.ko;bs="";}
    else if(S.gMode==="romaji"){a=w.jp;as=rd;b=romaji(w.kana);bs="";}
    else {a=w.jp;as="";b=w.kana;bs="";}    /* 읽기 맞추기 — 힌트는 감춘다 */
    if(!a||!b||a===b)continue;
    picked.push({id:picked.length,a:a,as:as,b:b,bs:bs,jp:w.jp,kana:w.kana,ko:w.ko});
  }
  for(i=0;i<picked.length;i++){
    cards.push({pid:picked[i].id,side:"a",t:picked[i].a,sub:picked[i].as});
    cards.push({pid:picked[i].id,side:"b",t:picked[i].b,sub:picked[i].bs});
  }
  S.gPairs=picked;S.gCards=shuffle(cards);S.gSel=null;S.gMatched={};S.gTries=0;S.gWrong=null;S.gStart=Date.now();
}

  var list=S.vList==="class"?CLASSW.filter(function(w){return !/^생활/.test(w.tag||"");}):
           (S.vList==="life"?CLASSW.filter(function(w){return /^생활/.test(w.tag||"");}):
           (S.vList==="verb"?N5VERBS:(S.vList==="my"?S.my:TRAVELW))),q=(S.vQ||"").toLowerCase(),shown=0,lastTag="";
  for(i=0;i<list.length;i++){
    var w=list[i];
    if(q){
      var hay=(w.jp+w.kana+toKata(w.kana)+toHira(w.kana)+romaji(w.kana)+w.ko).toLowerCase();
      if(hay.indexOf(q)<0)continue;
    }
    shown++;
    if(shown>80)break;
    var rd=(w.jp!==w.kana)?w.kana:"";
    if(w.tag&&w.tag!==lastTag){h+='<div class="lab" style="margin-top:14px">'+esc(w.tag)+'</div>';lastTag=w.tag;}
    h+='<div class="vrow"><div class="vmain">'+
       (rd?'<div class="vread">'+esc(rd)+'</div>':'')+
       '<div class="vjp">'+esc(w.jp)+'</div>'+
       '<div class="vko">'+esc(w.ko)+'</div>'+
       '<div class="vro mono">'+esc(koPron(w.kana))+' · '+esc(romaji(w.kana))+'</div>'+radHintRow(w.jp)+'</div>'+
       '<button class="spk vspk" data-a="say" data-v="'+esc(sayText(w.jp,w.kana))+'">▶</button></div>';
  }
  if(!shown)h+='<div class="empty">검색 결과가 없습니다.</div>';
  else if(shown>80)h+='<p class="note">80개까지 표시했습니다. 검색으로 좁혀 보세요.</p>';
  else h+='<p class="note">'+shown+'개 · 단어를 누르면 발음이 나옵니다.</p>';
  return h;
}
function viewGame(){
  var h="",i;
  var modes=[["mean","일본어 ↔ 뜻"],["read","한자 ↔ 읽기"],["romaji","일본어 ↔ 로마자"]];
  var srcs=[["today","오늘 10개"],["class","수업 단어"],["verb","N5 동사"],["travel","여행 단어"]];
  if(S.my.length)srcs.push(["my","내 단어"]);
  h+='<div class="lab">맞출 내용</div><div class="chips">';
  for(i=0;i<modes.length;i++)h+='<button class="chip sm" data-on="'+(S.gMode===modes[i][0]?1:0)+'" data-a="gmode" data-v="'+modes[i][0]+'">'+modes[i][1]+'</button>';
  h+='</div><div class="lab">단어 출처</div><div class="chips">';
  for(i=0;i<srcs.length;i++)h+='<button class="chip sm" data-on="'+(S.gSrc===srcs[i][0]?1:0)+'" data-a="gsrc" data-v="'+srcs[i][0]+'">'+srcs[i][1]+'</button>';
  h+='</div>';

  if(!S.gCards)newGame();
  var done=Object.keys(S.gMatched).length;
  if(done>=S.gPairs.length&&S.gPairs.length){
    var sec=Math.round((S.gDone-S.gStart)/1000);
    h+='<div class="empty"><b>6쌍 완성</b>'+sec+'초 · 시도 '+S.gTries+'번'+
       (S.gTries<=8?'<div style="margin-top:6px;color:#7ED9A6">거의 안 틀렸어요</div>':"")+
       '<div class="row" style="margin-top:16px"><button class="btn go" data-a="gnew">새 카드로 다시</button></div></div>';
    h+='<div class="card" style="margin-top:12px"><div class="tag mono">이번에 맞춘 단어</div><table class="vocab">';
    for(i=0;i<S.gPairs.length;i++)
      h+='<tr><td><div class="v1" style="font-size:29px">'+esc(S.gPairs[i].jp)+'</div>'+
         (S.gPairs[i].jp!==S.gPairs[i].kana?'<div class="v2" style="font-size:23px">'+esc(S.gPairs[i].kana)+'</div>':'')+'<div class="v2 mono" style="color:#9CC8E4">'+esc(romaji(S.gPairs[i].kana))+'</div></td>'+
         '<td class="v4">'+esc(S.gPairs[i].ko)+'</td>'+
         '<td style="width:38px"><button class="spk" data-a="say" data-v="'+esc(sayText(S.gPairs[i].jp,S.gPairs[i].kana))+'">▶</button></td></tr>';
    h+='</table></div>';
    return h;
  }
  h+='<div style="display:flex;justify-content:space-between;font-size:16.5px;color:#8A9CBE;margin:6px 0 8px">'+
     '<span>'+done+' / '+S.gPairs.length+' 쌍</span><span class="mono">시도 '+S.gTries+'</span></div>';
  h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">';
  for(i=0;i<S.gCards.length;i++){
    var c=S.gCards[i],st="";
    if(S.gMatched[c.pid])st="opacity:.25;border-color:#2FA05E;color:#9CDCB8";
    else if(S.gSel===i)st="border-color:#F4F1E8;background:rgba(255,255,255,.12)";
    else if(S.gWrong&&(S.gWrong[0]===i||S.gWrong[1]===i))st="border-color:#E4573D;background:rgba(228,87,61,.15)";
    var pr2=null,z;
    for(z=0;z<S.gPairs.length;z++)if(S.gPairs[z].id===c.pid)pr2=S.gPairs[z];
    var sub=c.sub;
    if(S.gMatched[c.pid]&&!sub&&pr2&&c.side==="a"&&pr2.jp!==pr2.kana)sub=pr2.kana;
    h+='<button class="tile gcard" style="'+st+'" '+(S.gMatched[c.pid]?"disabled":"")+
       ' data-a="gcard" data-v="'+i+'">'+
       (sub?'<span class="gsub">'+esc(sub)+'</span>':"")+'<span class="gmain">'+esc(c.t)+'</span></button>';
  }
  h+='</div>';
  h+='<div class="row"><button class="btn sm" data-a="gnew">새 카드</button></div>';
  h+='<p class="note">짝이 되는 카드 두 장을 차례로 누르세요. 맞으면 초록색으로 바뀌면서 읽는 법이 함께 나타나고 발음도 들려줍니다.</p>';
  return h;
}

/* ===== 조사 훈련 ===== */
function jPools(){var o=[];for(var k in JOSHI)o.push(k);return o;}
function jMake(){
  var keys=(S.jSets&&S.jSets.length)?S.jSets:jPools();
  var k=pick(keys),set=JOSHI[k];
  var it=pick(set.items);
  var opts=shuffle([it[3]].concat(it[4].slice(0,3)));
  S.jQ={set:k,setT:set.t,jp:it[0],kana:it[1],ko:it[2],ans:it[3],opts:opts,why:it[5],
        full:it[0].split("____").join(it[3]),fullK:it[1].split("____").join(it[3])};
  S.jPicked=null;
}
function viewJoshi(){
  var h="",i,keys=jPools();

function ybPick(kind){
  if(kind==="v")return pick(N5VERBS);
  if(kind==="i"){var a=pick(YB_I);return {jp:a[0],kana:a[1],ko:a[2],pos:"i"};}
  if(kind==="na"){var b=pick(YB_NA);return {jp:b[0],kana:b[1],ko:b[2],pos:"na"};}
  var c=pick(YB_N);return {jp:c[0],kana:c[1],ko:c[2],pos:"n"};
}
function ybMake(sec){
  var q,w,f,ans,ansK,tip;
  if(sec===1){                                   /* 동사 활용 */
    w=ybPick("v");
    var fl=S.ybForms.length?S.ybForms:["masu"];
    f=pick(fl);
    var r=conjugate(w.jp,w.kana,f);
    ans=r.jp;ansK=r.kana;
    tip=["","1그룹","2그룹","3그룹"][r.g]+" 동사";
    if(EXC1[w.jp])tip="예외 1그룹 — 모양은 2그룹이지만 1그룹으로 활용합니다";
    if(w.jp==="行く"&&(f==="te"||f==="ta"||f==="tari"))tip="行く는 예외 — く이지만 って·った로 갑니다";
    q={kind:"v",jp:w.jp,kana:w.kana,ko:w.ko,form:f,ans:ans,ansK:ansK,tip:tip};
  }
  else if(sec===2){                              /* 명사 · な형 · い형 */
    w=ybPick(pick(["i","na","n"]));
    f=pick(S.ybPForms.length?S.ybPForms:["desu"]);
    ans=(w.pos==="i")?ybAdjI(w.jp,f):ybNoun(w.jp,f);
    ansK=(w.pos==="i")?ybAdjI(w.kana,f):ybNoun(w.kana,f);
    tip=w.pos==="i"?"い형용사 — い를 떼고 붙입니다":(w.pos==="na"?"な형용사 — 어간 그대로, 명사와 같은 방식":"명사 — です·だった·じゃない");
    q={kind:"p",jp:w.jp,kana:w.kana,ko:w.ko,form:f,ans:ans,ansK:ansK,tip:tip,pos:w.pos};
  }
  else if(sec===3){                              /* ~たいです · ほしいです */
    if(Math.random()<0.35){
      var n=(function(){var x=pick(YB_HN);return {jp:x[0],kana:x[1],ko:x[2]};})();
      var hf=pick(["tai","takunai","takatta","takunakatta"]);
      var hm={tai:["ほしいです","가 갖고 싶습니다"],takunai:["ほしくないです","가 갖고 싶지 않습니다"],
              takatta:["ほしかったです","가 갖고 싶었습니다"],takunakatta:["ほしくなかったです","가 갖고 싶지 않았습니다"]};
      q={kind:"hoshii",jp:n.jp,kana:n.kana,ko:n.ko,form:hf,
         ans:n.jp+"が"+hm[hf][0],ansK:n.kana+"が"+hm[hf][0],
         tip:"명사 + が + ほしい. ほしい는 い형용사처럼 활용합니다",label:n.ko+hm[hf][1]};
    }else{
      w=ybPick("v");
      f=pick(["tai","takunai","takatta","takunakatta"]);
      var r2=conjugate(w.jp,w.kana,f);
      q={kind:"v",jp:w.jp,kana:w.kana,ko:w.ko,form:f,ans:r2.jp,ansK:r2.kana,
         tip:"ます형 어간 + たい. たい는 い형용사처럼 활용합니다"};
    }
  }
  else{                                          /* ~たり~たりする */
    var w1=ybPick("v"),w2=ybPick("v"),guard=0;
    while(w2.jp===w1.jp&&guard++<10)w2=ybPick("v");
    var neg=Math.random()<0.35;
    var fm=neg?"nakattari":"tari";
    var a1=conjugate(w1.jp,w1.kana,fm),a2=conjugate(w2.jp,w2.kana,fm);
    q={kind:"tari",jp:w1.jp+" / "+w2.jp,kana:w1.kana+" / "+w2.kana,
       ko:w1.ko+(neg?"하지 않거나 ":"하거나 ")+w2.ko+(neg?"하지 않거나 합니다":"하거나 합니다"),
       form:fm,ans:a1.jp+"、"+a2.jp+"します",ansK:a1.kana+"、"+a2.kana+"します",
       tip:neg?"ない형에서 い를 빼고 かったり":"た형 + り. 마지막에 します를 붙입니다"};
  }
  q.ok=[q.ans,q.ansK,romaji(q.ansK)];
  return q;
}










/* 한국어 활용 생성기 — 뜻(사전형)에서 네 형태를 만든다 */
var KO_IRR={"있다":["있습니다","없습니다","있었습니다","없었습니다","있고","있었다","없다"],
            "없다":["없습니다","있습니다","없었습니다","있었습니다","없고","없었다","있다"]};
function koSplit(t){
  return (t||"").replace(/\([^)]*\)/g,"").split(/[,·]/)[0].trim();
}
function koDec(ch){var c=ch.charCodeAt(0)-0xAC00;if(c<0||c>11171)return null;
  return {cho:Math.floor(c/588),jung:Math.floor((c%588)/28),jong:c%28};}
function koCom(d){return String.fromCharCode(0xAC00+d.cho*588+d.jung*28+d.jong);}
function koEul(stem){
  var last=stem.slice(-1),d=koDec(last);
  if(!d)return stem+"을 수 있다";
  if(d.jong===0)return stem.slice(0,-1)+koCom({cho:d.cho,jung:d.jung,jong:8})+" 수 있다";
  if(d.jong===8)return stem+" 수 있다";
  return stem+"을 수 있다";
}
function koPresent(stem){
  var last=stem.slice(-1),d=koDec(last);
  if(!d)return stem+"습니다";
  if(d.jong===0)return stem.slice(0,-1)+koCom({cho:d.cho,jung:d.jung,jong:17})+"니다";
  if(d.jong===8)return stem.slice(0,-1)+koCom({cho:d.cho,jung:d.jung,jong:17})+"니다"; /* ㄹ 탈락 */
  return stem+"습니다";
}
function koPastStem(stem,kind){
  var last=stem.slice(-1),d=koDec(last),head=stem.slice(0,-1);
  if(!d)return stem+"었";
  if(last==="하")return head+"했";
  if(d.jong!==0){
    if("걷듣묻싣".indexOf(last)>=0&&d.jong===7)                     /* ㄷ 불규칙 */
      return head+koCom({cho:d.cho,jung:d.jung,jong:8})+"었";
    if(d.jong===17&&(kind==="i"||"덥춥맵쉽곱돕굽눕".indexOf(last)>=0||/[겁럽갑]$/.test(last))){ /* ㅂ 불규칙 */
      var bare=koCom({cho:d.cho,jung:d.jung,jong:0});
      return head+bare+(("돕곱".indexOf(last)>=0)?"왔":"웠");
    }
    return stem+((d.jung===0||d.jung===8)?"았":"었");
  }
  if(d.jung===18){                                                  /* ㅡ 계열 */
    if(last==="르"&&head){                                          /* 르 불규칙 */
      var pv=koDec(head.slice(-1));
      var linked=head.slice(0,-1)+koCom({cho:pv.cho,jung:pv.jung,jong:8});
      return linked+((pv.jung===0||pv.jung===8)?"랐":"렀");
    }
    if(head){
      var pv2=koDec(head.slice(-1));
      var ju=(pv2&&(pv2.jung===0||pv2.jung===8))?0:4;
      return head+koCom({cho:d.cho,jung:ju,jong:20});
    }
    return head+koCom({cho:d.cho,jung:4,jong:20});
  }
  var J={0:[0,20],8:[9,20],13:[14,20],20:[6,20],1:[1,20],5:[5,20],4:[4,20],6:[6,20],2:[2,20],12:[12,20]};
  var m=J[d.jung];
  if(m)return head+koCom({cho:d.cho,jung:m[0],jong:m[1]});
  return stem+"었";
}
function koConj(ko,kind){
  var base=koSplit(ko);
  if(KO_IRR[base]){var a=KO_IRR[base];return {pres:a[0],neg:a[1],past:a[2],pastNeg:a[3],te:a[4],ta:a[5],nai:a[6]};}
  if(kind==="n"){

var ADVW={};
"別の,全部,少し,たくさん,もっと,だいたい,ちょうど,すぐに,後で,早めに,まっすぐ,びっくり,がっかり,一生懸命,改めて,前もって,ぜひ,必ず".split(",").forEach(function(x){ADVW[x]=1;});

/* ===== 보통체 (丁寧形 ↔ 普通形) ===== */
function futsuPair(w,type,t){
  /* t: t1 긍정 t2 부정 t3 과거 t4 과거부정 — [정중형, 보통형] */
  var P,F,PK,FK;
  if(type==="v"){
    var m={t1:"masu",t2:"masen",t3:"mashita",t4:"masendeshita"}[t];
    var r=conjugate(w.jp,w.kana,m);P=r.jp;PK=r.kana;
    if(t==="t1"){F=w.jp;FK=w.kana;}
    else{var pf={t2:"nai",t3:"ta",t4:"nakatta"}[t],r2=conjugate(w.jp,w.kana,pf);F=r2.jp;FK=r2.kana;}
  }else if(type==="i"){
    var st=(w.jp==="いい")?"よ":w.jp.slice(0,-1), stK=(w.kana==="いい")?"よ":w.kana.slice(0,-1);
    P={t1:w.jp+"です",t2:st+"くないです",t3:st+"かったです",t4:st+"くなかったです"}[t];
    PK={t1:w.kana+"です",t2:stK+"くないです",t3:stK+"かったです",t4:stK+"くなかったです"}[t];
    F={t1:w.jp,t2:st+"くない",t3:st+"かった",t4:st+"くなかった"}[t];
    FK={t1:w.kana,t2:stK+"くない",t3:stK+"かった",t4:stK+"くなかった"}[t];
  }else{
    P={t1:w.jp+"です",t2:w.jp+"じゃありません",t3:w.jp+"でした",t4:w.jp+"じゃありませんでした"}[t];
    PK={t1:w.kana+"です",t2:w.kana+"じゃありません",t3:w.kana+"でした",t4:w.kana+"じゃありませんでした"}[t];
    F={t1:w.jp+"だ",t2:w.jp+"じゃない",t3:w.jp+"だった",t4:w.jp+"じゃなかった"}[t];
    FK={t1:w.kana+"だ",t2:w.kana+"じゃない",t3:w.kana+"だった",t4:w.kana+"じゃなかった"}[t];
  }
  return {p:P,pk:PK,f:F,fk:FK};
}

function bunkeiOf(w,k){
  var b=BUNKEI[k],st,stK;
  if(b.base==="m"){var m=mStem(w);st=m.jp;stK=m.kana;}
  else if(b.base==="t"){var t1=conjugate(w.jp,w.kana,"te");st=t1.jp;stK=t1.kana;}
  else if(b.base==="a"){var a1=conjugate(w.jp,w.kana,"ta");st=a1.jp;stK=a1.kana;}
  else if(b.base==="nd"){var d1=conjugate(w.jp,w.kana,"nai");st=d1.jp;stK=d1.kana;}
  else {var n1=nStem(w);st=n1.jp;stK=n1.kana;}
  return {jp:st+b.sfx,kana:stK+(b.sfxK||b.sfx)};
}

/* 이 동사에 이 형태를 쓸 수 있는가 */
function v9Allows(w,f){
  var j=w.jp;
  if(STATIVE[j])return false;
  if(/^poten|^koto/.test(f))        return !INANIM[j]&&!NONVOL[j];
  if(/^caus(?!P)|^causM|^causPast/.test(f)) return !INANIM[j]||!!CAUS_OK[j];
  if(/^pass/.test(f))               return (!INANIM[j]||!!PASS_OK[j])&&!NOPASS[j];
  if(/^cpass/.test(f)){
    if(NONVOL[j]||INANIM[j])return false;
    if(f==="cpass2")              /* 축약형은 1그룹이면서 す로 끝나지 않는 동사만 */
      return vGroup(j,w.kana)===1&&j.charAt(j.length-1)!=="す";
    return true;
  }
  if(/^vol|^tsumori/.test(f))       return !NONVOL[j]&&!INANIM[j];
  return true;
}

/* 보통체 · でしょう · そうです 연습에 쓰는 명사 풀을 여행 단어와 수업 단어까지 넓힌다 */
(function(){
  var seen={},i,w;
  for(i=0;i<YB_N.length;i++)seen[YB_N[i][0]]=1;
  function addNoun(jp,kana,ko){
    if(seen[jp])return;
    if(/[다]$/.test(ko))return;              /* 형용사·동사 뜻은 제외 */
    if(/^(する|ある|いる)$/.test(jp))return;
    seen[jp]=1;YB_N.push([jp,kana,ko]);
  }
  for(i=0;i<TRAVELW.length;i++){w=TRAVELW[i];addNoun(w.jp,w.kana,w.ko);}
  for(i=0;i<CLASSW.length;i++){w=CLASSW[i];
    if(w.tag==="17과 단어"||w.tag==="18과 주고받는 동사")addNoun(w.jp,w.kana,w.ko);}

})();

function junjoOf(w,k){
  var j=JUNJO[k],base,baseK;

}

  }else{

    baseK=(slot==="d1")?w.kana:(slot==="d2"?w.kana+"じゃない":(slot==="d3"?w.kana+"だった":w.kana+"じゃなかった"));

function gname(jp,kana){
  if(EXC1[jp])return "예외 1그룹";
  return ["","1그룹","2그룹","3그룹"][vGroup(jp,kana)];
}
function ruleFor(jp,kana,form){
  var g=vGroup(jp,kana),last=jp.charAt(jp.length-1),lastK=kana.charAt(kana.length-1),gn=gname(jp,kana);
  var I={"う":"い","く":"き","ぐ":"ぎ","す":"し","つ":"ち","ぬ":"に","ぶ":"び","む":"み","る":"り"};
  var A={"う":"わ","く":"か","ぐ":"が","す":"さ","つ":"た","ぬ":"な","ぶ":"ば","む":"ま","る":"ら"};
  var TE={"く":"いて","ぐ":"いで","う":"って","つ":"って","る":"って","む":"んで","ぶ":"んで","ぬ":"んで","す":"して"};
  var TA={"く":"いた","ぐ":"いだ","う":"った","つ":"った","る":"った","む":"んだ","ぶ":"んだ","ぬ":"んだ","す":"した"};
  if(form==="masu"||form==="masen"||form==="mashita"||form==="masendeshita"){
    if(g===3)return gn+" — し / 来(き) 에 붙입니다";
    if(g===2)return gn+" — る 떼고 붙입니다";
    return gn+" — 어미 "+lastK+" → "+(I[lastK]||"")+" 로 바꾸고 붙입니다";
  }
  if(form==="te"){
    if(jp==="行く")return "예외 — 行く만 って로 갑니다";
    if(g===3)return gn+" — して / 来て(きて)";
    if(g===2)return gn+" — る 떼고 て";
    return gn+" — "+lastK+" → "+(TE[lastK]||"て");
  }
  if(form==="ta"||form==="tari"){
    if(jp==="行く")return "예외 — 行く만 った로 갑니다";
    if(g===3)return gn+" — した / 来た(きた)";
    if(g===2)return gn+" — る 떼고 た";
    return gn+" — "+lastK+" → "+(TA[lastK]||"た");
  }
  if(form==="nai"||form==="nakatta"||form==="nakattari"){
    if(jp==="ある")return "예외 — ある의 부정은 그냥 ない";
    if(g===3)return gn+" — しない / 来ない(こない)";
    if(g===2)return gn+" — る 떼고 ない";
    if(lastK==="う")return gn+" — 어미 う → わ (あ가 아닙니다)";
    return gn+" — 어미 "+lastK+" → "+(A[lastK]||"")+" + ない";
  }
  if(form.indexOf("ta")===0)return gn+" — ます어간에 붙입니다";
  return gn;
}

function pb(t,kana){

  return '<button class="spk" style="width:40px;height:40px;font-size:14px" data-a="say" data-v="'+esc(sayText(t,kana))+'">▶</button>';
}
function ybSteps(q){

  if(f==="nai"||f==="nakatta")
    return q.jp+" · "+gname+" → ない어간 「"+nstem+"」 + "+q.ans.slice(nstem.length);
  if(f==="te"||f==="ta"||f==="tari"||f==="nakattari"){
    var last=q.jp.charAt(q.jp.length-1);
    var rule=(g===1)?("어미 "+last+" → "+({"く":"いて·いた","ぐ":"いで·いだ","う":"って·った","つ":"って·った","る":"って·った","む":"んで·んだ","ぶ":"んで·んだ","ぬ":"んで·んだ","す":"して·した"}[last]||"")):

    if(q.jp==="行く")rule="行く는 예외 → って·った";

          :(g===2?"る를 떼고 + られる":(/する$/.test(q.jp)?"する → できる":"来る → 来られる(こられる)"));
    return q.jp+" · "+gname+" → "+pr;
  }
  if(f==="caus"||f==="causM"||f==="causPast"){
    var cr=(g===1)?("어미를 "+A2+"으로 (う는 わ) → 「"+nstem+"」 + せる")

  if(f==="pass"||f==="passM"||f==="passPast"||f==="sonkeiR"){

          :(g===2?"る를 떼고 + られる":(/する$/.test(q.jp)?"する → される":"来る → 来られる(こられる)"));
    return q.jp+" · "+gname+" → "+sr+(f==="sonkeiR"?" (수동형과 같은 모양)":"");
  }
  if(/^cpass/.test(f)){
    var xr=(g===1)?("「"+nstem+"」 + せられる"+(q.jp.slice(-1)==="す"?" (す로 끝나서 축약형 없음)":" / 축약 「"+nstem+"」 + される"))

function ybListen(q){

  if(/____/.test(String(q.jp)))return "";
  /* 날짜·요일은 읽는 법 자체가 정답이라 미리 들려주지 않습니다 */
  if(q.kind==="date")return "";
  var parts=String(q.jp).split(" / "),kparts=String(q.kana||"").split(" / ");
  var h='<div class="pill" style="margin-top:10px">',i,t;
  for(i=0;i<parts.length;i++){
    t=sayText(parts[i],kparts[i]);
    if(!t||/____/.test(t))continue;
    h+='<button data-a="say" data-v="'+esc(t)+'">▶ '+(parts.length>1?esc(parts[i]):"기본형 듣기")+'</button>';
  }
  t=sayText(parts[0],kparts[0]);
  if(t&&!/____/.test(t))h+='<button data-a="sayslow" data-v="'+esc(t)+'">느리게</button>';
  return h+'</div>';
}

/* ---- 오늘 단어 10개로 만드는 자동 작문 (날짜+단어로 고정되어 다시 그려도 바뀌지 않습니다) ---- */
function rdHash(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h;}
function rdRng(seed){var s=seed>>>0;return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
function rdShuf(a,rng){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rdGenLine(w,i){
  var p=wPos(w),m=koSplit(w.ko||"")||(w.ko||""),jp=w.jp,ka=w.kana||w.jp;
  function mk(pj,pk,jj,kk,sj,sk,ko){return [pj+jj+sj,pk+kk+sk,ko];}
  if(p==="n"&&/다$/.test(m)){                       /* 받다 (겸양) 처럼 괄호가 붙은 동사 */
    if(/[うくぐすつぬぶむる]$/.test(ka))p="v";
    else if(/い$/.test(ka))p="i";
  }
  if(p==="n"&&/な$/.test(jp)&&jp.length>1)          /* 大きな·小さな 같은 연체사 */
    return [jp+"家です。",ka+"いえです。",m+" 집입니다."];
  if(p==="v"){
    var kc=koConj(w.ko||"","v"),odd=STATIVE[jp]||INANIM[jp]||NONVOL[jp],f,r,k;
    if(odd){
      k=i%3;
      f=["masu","mashita","masen"][k];r=conjugate(jp,ka,f);
      var st=STATIVE[jp]?1:0;
      var pj=st?["今は","昨日は","あまり"][k]:["もうすぐ","さっき","まだ"][k],
          pk=st?["いまは","きのうは","あまり"][k]:["もうすぐ","さっき","まだ"][k],
          pc=st?["지금은 ","어제는 ","별로 "][k]:["곧 ","아까 ","아직 "][k];
      return mk(pj,pk,r.jp,r.kana,"。","。",pc+(kc?[kc.pres,kc.past,kc.neg][k]:m)+".");
    }
    k=i%5;
    f=["masu","mashita","tai","te","masen"][k];r=conjugate(jp,ka,f);
    if(k===0)return mk("毎日","まいにち",r.jp,r.kana,"。","。","매일 "+(kc?kc.pres:m)+".");
    if(k===1)return mk("昨日、","きのう、",r.jp,r.kana,"。","。","어제 "+(kc?kc.past:m)+".");
    if(k===2)return mk("明日は","あしたは",r.jp,r.kana,"。","。","내일은 "+(kc?kc.te+" 싶습니다":m)+".");
    if(k===3)return mk("",""  ,r.jp,r.kana,"、少し休みます。","、すこしやすみます。",(kc?kc.te:m)+" 잠시 쉽니다.");
    return mk("あまり","あまり",r.jp,r.kana,"。","。","별로 "+(kc?kc.neg:m)+".");
  }
  if(p==="i"||p==="na"){
    var b=(p==="na")?naBase(w):w,kc2=koConj(w.ko||"","i"),k2=i%3,fm=["desu","deshita","janai"][k2];
    var aj=(p==="i")?ybAdjI(b.jp,fm):ybNoun(b.jp,fm),ak=(p==="i")?ybAdjI(b.kana,fm):ybNoun(b.kana,fm);
    var pre=[["今日は","きょうは"],["昨日は","きのうは"],["あまり","あまり"]][k2];
    var kopre=["오늘은 ","어제는 ","별로 "][k2],kov=kc2?[kc2.pres,kc2.past,kc2.neg][k2]:m;
    return mk(pre[0],pre[1],aj,ak,"。","。",kopre+kov+".");
  }
  if(p==="adv")return [jp+"勉強します。",ka+"べんきょうします。",m+" 공부합니다."];
  var k3=i%4;
  if(k3===0)return ["これは"+jp+"です。","これは"+ka+"です。","이것은 "+m+"입니다."];
  if(k3===1)return [jp+"はどこですか。",ka+"はどこですか。",eun(m)+" 어디입니까?"];
  if(k3===2)return ["昨日、"+jp+"について話しました。","きのう、"+ka+"についてはなしました。","어제 "+m+"에 대해 이야기했습니다."];
  return ["それは"+jp+"じゃないです。","それは"+ka+"じゃないです。","그것은 "+m+(bat(m)?"이":"가")+" 아닙니다."];
}
function rdGenToday(){
  ensureChallenge();
  var ws=chWords();
  if(!ws||ws.length<2)return null;
  var id="gen-"+todayStr()+"-"+rdHash((S.ch.ids||[]).join(","));
  if(S._rdg&&S._rdg.id===id)return S._rdg;
  var lines=[["今日は新しい言葉で文を作ります。","きょうはあたらしいことばでぶんをつくります。","오늘은 새 단어로 문장을 만들어 봅니다."]],
      words=[],i,rng=rdRng(rdHash(id));
  for(i=0;i<ws.length;i++){
    var ln;
    try{ln=rdGenLine(ws[i],i);}catch(e){ln=[ws[i].jp+"。",(ws[i].kana||ws[i].jp)+"。",koSplit(ws[i].ko||"")+"."];}
    lines.push(ln);
    words.push([ws[i].jp,ws[i].kana||ws[i].jp,koSplit(ws[i].ko||"")||(ws[i].ko||"")]);
  }
  var order=rdShuf(words.map(function(_,x){return x;}),rng),quiz=[],n=Math.min(4,order.length),qi;
  for(qi=0;qi<n;qi++){

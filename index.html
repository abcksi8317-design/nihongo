    if(qi%2===0){
      var others=rdShuf(words.map(function(_,x){return x;}).filter(function(x){return x!==ix&&words[x][2]!==words[ix][2];}),rng).slice(0,3);
      var mm=rdShuf([ix].concat(others),rng);
      opts=mm.map(function(x){return words[x][2];});ans=mm.indexOf(ix);
      q={q:"「"+words[ix][0]+"」の意味は？",opts:opts,a:ans,w:words[ix][0]+" = "+words[ix][2]+" · "+lines[ix+1][0]+" ("+lines[ix+1][2]+")"};
    }else{
      var oth=rdShuf(words.map(function(_,x){return x;}).filter(function(x){return x!==ix;}),rng).slice(0,3);
      var mm2=rdShuf([ix].concat(oth),rng);
      q={q:"다음 뜻에 맞는 문장은? "+lines[ix+1][2],opts:mm2.map(function(x){return lines[x+1][0];}),a:mm2.indexOf(ix),
         w:lines[ix+1][0]+" — "+lines[ix+1][2]};
    }
    quiz.push(q);
  }
  S._rdg={id:id,gen:true,t:"오늘의 단어 읽기",sub:"오늘 단어 "+ws.length+"개로 만든 작문",lv:"0",
          gram:["ます·た·たい·て","형용사 활용","명사 문형"],lines:lines,words:words,quiz:quiz};
  return S._rdg;
}
function rdSync(){
  var g=null;

  var i;
  for(i=READS.length-1;i>=0;i--)if(READS[i].gen&&(!g||READS[i].id!==g.id))READS.splice(i,1);
  if(!g)return -1;
  for(i=0;i<READS.length;i++)if(READS[i].id===g.id)return i;

function rdStaticN(){var n=0,i;for(i=0;i<READS.length;i++)if(!READS[i].gen)n++;return n;}

  for(var i=0;i<tabs.length;i++)h+='<button data-on="'+(S.tab===tabs[i][0]?1:0)+'" data-a="tab" data-v="'+tabs[i][0]+'">'+tabs[i][1]+'</button>';
  h+='</div>';
  h+=ttsBanner();
  if(S.tab==="course"){
    var subs=[["today","오늘의 강의"],["build","문장 만들기"],["log","학습 기록"],["review","주간 복습"]];
    h+='<div class="sub">';
    for(i=0;i<subs.length;i++)h+='<button data-on="'+(S.csub===subs[i][0]?1:0)+'" data-a="csub" data-v="'+subs[i][0]+'">'+subs[i][1]+'</button>';
    h+='</div>';
    h+= S.csub==="today"?viewToday():(S.csub==="build"?viewBuild():(S.csub==="log"?viewLog():viewReview()));
  }else if(S.tab==="yb"){h+=viewYb();}
  else if(S.tab==="sheet"){h+=viewSheet();}
  else if(S.tab==="vocab"){h+=viewVocab();}
  else if(S.tab==="drill"){h+=viewDrill();}
  else if(S.tab==="talk"){
    var tsubs=[["scene","상황 대화"],["read","읽기"],["card","표현 카드"]],ti;
    h+='<div class="sub">';
    for(ti=0;ti<tsubs.length;ti++)
      h+='<button data-on="'+(S.tSub===tsubs[ti][0]?1:0)+'" data-a="tsub" data-v="'+tsubs[ti][0]+'">'+tsubs[ti][1]+'</button>';
    h+='</div>';
    h+=(S.tSub==="scene"?viewScene():(S.tSub==="read"?viewRead():viewTalk()));
  }
  else if(S.tab==="home"){h+=viewHome();}

  h+='<div style="margin-top:22px;padding-top:14px;border-top:1px solid var(--line);text-align:center">'+
     '<div style="font-size:16px;color:#5E739C;letter-spacing:.1em;margin-bottom:8px">글씨 크기</div><div class="chips" style="justify-content:center">'+
     '<button class="chip sm" data-on="'+(S.fs===1?1:0)+'" data-a="fs" data-v="1">보통</button>'+
     '<button class="chip sm" data-on="'+(S.fs===2?1:0)+'" data-a="fs" data-v="2">크게</button>'+
     '<button class="chip sm" data-on="'+(S.fs===3?1:0)+'" data-a="fs" data-v="3">아주 크게</button></div>'+
     '<button class="link" data-a="diag">소리가 안 나오나요? 여기를 눌러 확인</button>';
  if(S.diag)h+='<div class="why" style="margin-top:10px;text-align:left">'+esc(S.diag)+'</div>';
  h+='</div>';
  document.body.className=S.fs===2?"fs2":(S.fs===3?"fs3":"");
  document.getElementById("app").innerHTML=h;
  if(S.tab==="yb"&&S.ybCat==="chain"&&S.cRes===null){
    var cb2=document.getElementById("ansbox");
    if(cb2){cb2.focus();cb2.addEventListener("keydown",function(e){if(e.key==="Enter")submitChain();});}
  }
  else if(S.tab==="yb"&&S.ybRes===null){
    var yb=document.getElementById("ansbox");
    if(yb){yb.focus();yb.addEventListener("keydown",function(e){if(e.key==="Enter")submitYb();});}
  }
  if(S.tab==="vocab"&&S.vSub==="today"&&S.chRes===null&&S.chQ&&S.chQ.stage===2){
    var cbx=document.getElementById("ansbox");
    if(cbx){cbx.focus();cbx.addEventListener("keydown",function(e){if(e.key==="Enter"){S.chInput=cbx.value;
      S.chRes=(judge(S.chInput,{ok:S.chQ.ok})===2)?1:0;chScore(S.chRes===1);render();say(S.chQ.w.jp);}});}
  }
  if(S.tab==="vocab"&&S.vSub==="list"){
    var vs=document.getElementById("vsearch");
    if(vs)vs.addEventListener("keydown",function(e){if(e.key==="Enter"){S.vQ=vs.value.trim();render();}});
  }
  if(S.tab==="sheet"&&S.ws&&S.wsRes===null){
    var box=document.getElementById("ansbox");
    if(box){
      var ty=SHEETS[S.wsIdx].type,sc=S.teSec;
      box.focus();
      box.addEventListener("keydown",function(e){
        if(e.key!=="Enter")return;
        if(ty==="te")submitTe(sc); else if(ty==="ta")submitTa(); else submitWs();
      });
    }
    var bA=document.getElementById("ansA"),bB=document.getElementById("ansB");
    if(bA){
      bA.focus();
      bA.addEventListener("keydown",function(e){if(e.key==="Enter"&&bB)bB.focus();});
      if(bB)bB.addEventListener("keydown",function(e){if(e.key==="Enter")submitMx();});
    }
  }
}

function submitChain(){
  var st=S.cSeq[S.cIdx],box=document.getElementById("ansbox");
  S.cInput=box?box.value:"";
  S.cRes=judge(S.cInput,{ok:[st.ans,st.ansK,romaji(st.ansK)]});
  S.cTotal++;
  if(S.cRes===2)S.cScore++;
  S.total++;saveTotal();
  render();say(st.ans);
}
function submitYb(){
  var q=S.ybQ,box=document.getElementById("ansbox");
  S.ybInput=box?box.value:"";
  S.ybRes=judge(S.ybInput,q);
  S.ybCount++;
  if(S.ybRes===2)S.ybScore++;
  S.total++;saveTotal();
  render();say(q.ans);
}
function submitWs(){
  var W=SHEETS[S.wsIdx],q=W.drill[S.wsQi],box=document.getElementById("ansbox");
  S.wsInput=box?box.value:"";
  S.wsRes=judge(S.wsInput,q);
  if(S.wsRes===2)S.wsScore++;
  S.total++;saveTotal();
  render();say(q.jp);
}

function submitTe(sec){
  var W=SHEETS[S.wsIdx],list=sec===2?W.conv:W.sent,q=list[S.wsQi];
  var box=document.getElementById("ansbox");
  S.wsInput=box?box.value:"";
  S.wsRes=judge(S.wsInput,q);
  if(S.wsRes===2)S.wsScore++;
  S.total++;saveTotal();
  render();say(sec===2?q.te:q.jp);
}

function keepMx(){
  var a=document.getElementById("ansA"),b=document.getElementById("ansB");
  if(a)S.mxA=a.value; if(b)S.mxB=b.value;
}
function submitMx(){
  keepMx();
  var t=TAVERBS[S.mxQi];
  var okTa={ok:[t[5],t[6],t[8]]},okNai={ok:[t[9],t[10],t[12]]};
  var rTa=S.mxAv?(judgeVoice([S.mxA],[t[5],t[6]]).res===2):(judge(S.mxA,okTa)===2);
  var rNai=S.mxBv?(judgeVoice([S.mxB],[t[9],t[10]]).res===2):(judge(S.mxB,okNai)===2);
  S.mxRes={ta:rTa,nai:rNai};
  if(S.mxRes.ta&&S.mxRes.nai&&S.mxGrp===t[3])S.mxScore++;
  S.total++;saveTotal();
  render();say(t[5]+"、"+t[9]);
}
function submitTa(){
  var W=SHEETS[S.wsIdx],q=W.sent[S.wsQi],box=document.getElementById("ansbox");
  S.wsInput=box?box.value:"";
  S.wsRes=judge(S.wsInput,q);
  if(S.wsRes===2)S.wsScore++;
  S.total++;saveTotal();
  render();say(q.jp);
}

  if(a==="radopen"){S.radIdx=parseInt(v,10);S.radQuiz=false;window.scrollTo(0,0);render();return;}
  if(a==="radclose"){S.radIdx=null;S.radQuiz=false;window.scrollTo(0,0);render();return;}

    S.total++;saveTotal();render();return;}

  if(a==="pipick"){

    S.piPicked=v;S.piTotal++;
    if(v===S.piQ.type)S.piScore++;
    S.total++;saveTotal();render();say(S.piQ.jp);return;}
  if(a==="pinext"){piMake();window.scrollTo(0,0);render();return;}

    S.ybCat="chain";S.cType=S.piQ.type;S.cAskPos=false;
    chBuild(S.piQ.word,S.piQ.type);S.cPosShow=false;window.scrollTo(0,0);render();return;}
  if(a==="caskpos"){S.cAskPos=!S.cAskPos;S.cPosPicked=null;S.cPosShow=false;render();return;}
  if(a==="cqmode"){S.cQMode=(S.cQMode==="ko")?"form":"ko";S.cHint=false;render();return;}
  if(a==="cshuffle"){S.cShuffle=!S.cShuffle;chBuild();S.cPosShow=false;render();return;}
  if(a==="chint"){S.cHint=true;render();return;}
  if(a==="cpos"){
    S.cPosPicked=v;S.cPosShow=true;S.piTotal++;
    if(v===S.cTypeNow)S.piScore++;
    render();say(S.cWord.jp);return;}
  if(a==="ctype"){S.cType=v;S.cToday=false;chBuild();render();return;}
  if(a==="cblock"){var bi=S.cBlocks.indexOf(v);
    if(bi>=0){if(S.cBlocks.length>1)S.cBlocks.splice(bi,1);}else S.cBlocks.push(v);
    chBuild();render();return;}
  if(a==="csubmit"){dayBump("drill");submitChain();return;}
  if(a==="cskip"){S.cInput="";S.cRes=0;S.cTotal++;render();say(S.cSeq[S.cIdx].ans);return;}
  if(a==="cretry"){S.cRes=null;S.cInput="";window.scrollTo(0,0);render();return;}
  if(a==="cnext"){S.cIdx++;S.cRes=null;S.cInput="";S.cHint=false;

    window.scrollTo(0,0);render();return;}

function syncMerge(n,lv,l,cv,c){
  var isO=function(x){return x&&typeof x==="object"&&!Array.isArray(x);};
  if(JSON.stringify(lv)===JSON.stringify(cv))return lv;
  if(n==="ch"&&isO(lv)&&isO(cv)){
    if(lv.date===cv.date){
      if(JSON.stringify(lv.ids)===JSON.stringify(cv.ids)){
        var cnt={},a=lv.cnt||{},b=cv.cnt||{};
        Object.keys(a).forEach(function(k){cnt[k]=a[k];});

        var base=(c>=l)?cv:lv,r={};Object.keys(base).forEach(function(k){r[k]=base[k];});r.cnt=cnt;return r;
      }
      return (syncSum(lv.cnt)>syncSum(cv.cnt))?lv:cv;     /* 같은 날 단어가 다르면 더 많이 진행한 쪽을 씁니다 */
    }
    return c>l?cv:lv;
  }
  if((n==="hist"||n==="rd"||n==="srs"||n==="course")&&isO(lv)&&isO(cv)){
    var o={},first=(c>l)?lv:cv,second=(c>l)?cv:lv;
    Object.keys(first).forEach(function(k){o[k]=first[k];});
    Object.keys(second).forEach(function(k){o[k]=second[k];});
    return o;
  }
  if(n==="total"&&typeof lv==="number"&&typeof cv==="number")return Math.max(lv,cv);
  if(n==="my"&&Array.isArray(lv)&&Array.isArray(cv)){
    var seen={},out=[];lv.concat(cv).forEach(function(x){var s=JSON.stringify(x);if(!seen[s]){seen[s]=1;out.push(x);}});return out;
  }

  var ref=SYNC.db.collection("users").doc(SYNC.user.uid);
  ref.get().then(function(snap){
    var dat=snap.exists?snap.data():{},cd=dat.d||{},ct=dat.t||{},lt=syncTmap(),changed=false,need=false,od={},ot={},names={};
    Object.keys(cd).forEach(function(n){names[n]=1;});
    syncKeys().forEach(function(k){names[k.slice(3)]=1;});
    Object.keys(names).forEach(function(n){
      var k="jp."+n,lraw=localStorage.getItem(k),craw=cd[n];
      var lv=(lraw==null)?undefined:syncParse(lraw),cv=(craw==null)?undefined:syncParse(craw);
      var l=lt[k]||0,c=ct[n]||0,res;
      if(cv===undefined)res=lv;else if(lv===undefined)res=cv;else res=syncMerge(n,lv,l,cv,c);
      if(res===undefined)return;
      var rs=JSON.stringify(res),tt=(rs===craw)?(c||1):((rs===lraw)?(l||Date.now()):Date.now());
      od[n]=rs;ot[n]=tt;
      if(rs!==craw)need=true;
      if(rs!==lraw&&allow){localStorage.setItem(k,rs);lt[k]=tt;changed=true;}
      else if(rs===lraw){lt[k]=tt;}
    });
    try{localStorage.setItem("jp._t",JSON.stringify(lt));}catch(e){}
    var p=need?ref.set({d:od,t:ot,u:Date.now()}):Promise.resolve();
    return p.then(function(){
      SYNC.last=Date.now();try{localStorage.setItem("jp.sync.last",JSON.stringify(SYNC.last));}catch(e){}
      SYNC.msg="";
      if(changed){
        var n2=+(sessionStorage.getItem("jp.rl")||0);
        if(n2<3){sessionStorage.setItem("jp.rl",String(n2+1));location.reload();return;}
      }else{try{sessionStorage.setItem("jp.rl","0");}catch(e){}}
    });
  }).catch(function(e){SYNC.msg="동기화 오류: "+((e&&(e.code||e.message))||e);})
    .then(function(){SYNC.busy=false;syncRedraw();});
}
function syncPush(){
  if(!SYNC.user)return;
  clearTimeout(SYNC.timer);SYNC.timer=setTimeout(function(){syncRun(false);},3000);
}
function syncLoad(urls,done){
  var i=0;(function next(){
    if(i>=urls.length){done();return;}
    var s=document.createElement("script");s.src=urls[i++];s.onload=next;
    s.onerror=function(){SYNC.msg="연동 도구를 불러오지 못했습니다(인터넷 확인).";syncRedraw();};
    document.head.appendChild(s);
  })();
}
function syncInit(){
  if(!FB_CONFIG)return;
  var base="https://www.gstatic.com/firebasejs/10.12.2/";
  syncLoad([base+"firebase-app-compat.js",base+"firebase-auth-compat.js",base+"firebase-firestore-compat.js"],function(){
    try{
      firebase.initializeApp(FB_CONFIG);
      SYNC.auth=firebase.auth();SYNC.db=firebase.firestore();
      SYNC.auth.getRedirectResult().catch(function(e){SYNC.msg="로그인 오류: "+(e.code||e.message);syncRedraw();});
      SYNC.auth.onAuthStateChanged(function(u){SYNC.user=u;syncRedraw();if(u)syncRun(true);});
    }catch(e){SYNC.msg="연동 설정 오류: "+(e.message||e);syncRedraw();}
  });
}
function syncCard(){
  var h='<div class="card" style="margin-top:14px"><div class="tag mono">기기 연동 · 백업</div>';
  if(!FB_CONFIG){
    h+='<div class="body">자동 연동은 <b>아직 꺼져 있습니다</b>. 설정을 마치면 폰·PC·태블릿이 같은 기록을 씁니다.</div>';
  }else if(!SYNC.user){
    h+='<div class="body">구글 계정으로 로그인하면 폰·PC·태블릿에서 <b>같은 학습 기록</b>이 이어집니다.</div>'+
       '<div class="row" style="margin-top:10px"><button class="btn" data-a="sylogin">구글로 로그인</button></div>';
  }else{
    h+='<div class="body"><b style="color:#7ED9A6">연동 켜짐</b> · '+esc(SYNC.user.email||"")+'<br>'+
       '<span class="v2" style="font-size:19px">마지막 동기화 '+(SYNC.last?new Date(SYNC.last).toLocaleString("ko-KR"):"아직 없음")+'</span></div>'+
       '<div class="row" style="margin-top:10px"><button class="btn sm" data-a="synow">지금 동기화</button>'+
       '<button class="btn sm" data-a="sylogout">로그아웃</button></div>';
  }
  if(SYNC.msg)h+='<div class="note" style="margin-top:6px">'+esc(SYNC.msg)+'</div>';
  h+='<div class="row" style="margin-top:10px"><button class="btn sm" data-a="syexp">기록 코드 복사</button>'+
     '<button class="btn sm" data-a="syimp">기록 코드 붙여넣기</button></div>'+
     '<div class="note" style="margin-top:6px">기록 코드는 수동 백업입니다. 초기화 사고나 기기 교체 때 쓰세요.</div></div>';
  return h;
}
document.addEventListener("click",function(ev){
  var el=ev.target.closest?ev.target.closest("[data-a]"):null;if(!el)return;
  var a=el.getAttribute("data-a");
  if(a==="sylogin"&&SYNC.auth){
    var pr=new firebase.auth.GoogleAuthProvider();
    SYNC.auth.signInWithPopup(pr).catch(function(e){
      if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))SYNC.auth.signInWithRedirect(pr);
      else if(e&&e.code!=="auth/popup-closed-by-user"){SYNC.msg="로그인 오류: "+(e.code||e.message);syncRedraw();}
    });return;
  }
  if(a==="sylogout"&&SYNC.auth){SYNC.auth.signOut();return;}
  if(a==="synow"){SYNC.busy=false;syncRun(true);return;}
  if(a==="syexp"){
    var o={};syncKeys().forEach(function(k){o[k]=localStorage.getItem(k);});
    var code="JPBK1:"+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(function(){alert("기록 코드를 복사했습니다. 다른 기기에서 '기록 코드 붙여넣기'를 누르고 붙여넣으세요.");},
        function(){prompt("이 코드를 전체 복사하세요",code);});
    }else prompt("이 코드를 전체 복사하세요",code);
    return;
  }
  if(a==="syimp"){
    var t=prompt("복사해 둔 기록 코드를 붙여넣으세요");if(!t)return;
    try{
      t=t.trim();if(t.indexOf("JPBK1:")!==0)throw 0;
      var d=JSON.parse(decodeURIComponent(escape(atob(t.slice(6))))),n=Object.keys(d).length;
      if(!n||!confirm("이 기기의 현재 기록을 코드의 기록으로 바꿉니다. 계속할까요? ("+n+"개 항목)"))return;
      var lt=syncTmap(),now=Date.now();
      Object.keys(d).forEach(function(k){if(/^jp\./.test(k)&&!/^jp\.(_t|sync)/.test(k)){localStorage.setItem(k,d[k]);lt[k]=now;}});
      localStorage.setItem("jp._t",JSON.stringify(lt));location.reload();
    }catch(e){alert("코드가 올바르지 않습니다. 처음부터 끝까지 그대로 붙여넣어 주세요.");}
    return;
  }
});
document.addEventListener("visibilitychange",function(){
  if(!SYNC.user)return;
  if(document.hidden){syncRun(false);}
  else if(Date.now()-(SYNC.last||0)>30000){syncRun(true);}
});
syncInit();

render();
</script>
</body>
</html>
